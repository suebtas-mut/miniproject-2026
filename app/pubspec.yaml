name: shuttle_app
description: Shuttle Bus System - Flutter Admin & Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.6

  # State management (flutter_riverpod exports riverpod — Flutter binding)
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.0

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # UI
  intl: ^0.18.0

  # Charting (reports R1/R4/R6 — Sprint 12/13)
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
