      description: |
        สร้างรอบเดินทางพร้อมเวลาถึงทุกจุด

        **BR-02** — `arriveAt` ของจุดสุดท้าย **ต้องเท่ากับ `departAt + totalMinutes` เสมอ**
        API จะคำนวณจาก `routeStop.travelMinutes` ทั้งหมด (seed ผ่าน BR-02 ครบ 8 รอบ)
      operationId: createSchedule
      x-uc: UC-14
      x-permission: SCHED.EDIT
      x-br: [BR-02]
      requestBody:
        required: true
        content:
