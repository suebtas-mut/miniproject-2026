            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: BR02_ARRIVE_MISMATCH
                message: 'arriveAt จุดสุดท้ายต้องเท่ากับ departAt + totalMinutes'
                details: { expected: '2026-10-01T09:43:00', received: '2026-10-01T09:40:00' }
        '409':
          description: 'มีรอบของเส้นทาง+วัน+เวลานี้อยู่แล้ว'
