  /api/permissions:
    get:
      tags: [M2 Master - RBAC]
      summary: ดูรายชื่อสิทธิ์ทั้งหมด (UC-08)
      description: |
        seed มี **21 สิทธิ์** แบ่งตาม 5 โมดูล — ใช้ตัวนี้สร้างหน้า Permission Matrix (UC-09)

        | โมดูล | จำนวน | รหัส |
        |---|---|---|
        | `master` | 5 | `EMP.VIEW` `EMP.EDIT` `DEPT.EDIT` `POS.EDIT` `ROLE.EDIT` |
        | `front` | 4 | `ROUTE.VIEW` `ROUTE.EDIT` `SCHED.EDIT` `VEH.EDIT` |
        | `booking` | 3 | `BK.CREATE` `BK.VIEW` `BK.CANCEL` |
        | `driver` | 3 | `QR.SCAN` `TRIP.START` `TRIP.END` |
        | `report` | 6 | `RPT.R1` `RPT.R2` `RPT.R3` `RPT.R5` `RPT.R6` `RPT.R7` |

        > ⚠️ **ช่องว่างที่พบระหว่างเขียนสเปกนี้ (ต้องแจ้งอาจารย์ / แก้ใน T-008)**
        >
        > โมดูล `report` มีรหัสข้าม **R4** ไป (`RPT.R1, R2, R3, R5, R6, R7` = 6 ตัว)
        > แต่ **R4 เป็นรายงานที่ PDF และ Use Case ระบุไว้ชัดเจน** (UC-28 · "สรุปยอดผู้ใช้รายวันรายเส้นทาง")
        > → ตอนนี้ **ไม่มีสิทธิ์ใดอนุญาตให้เปิดรายงาน R4 ได้**
        >
        > สเปกนี้จึงอ้าง `RPT.R4` ไว้ใน `x-permission` ของ `GET /api/reports/r4`
        > เพื่อให้ช่องว่างนี้ **มองเห็นได้ชัด** แทนที่จะแอบเปลี่ยนชื่อสิทธิ์ให้เข้ากับที่มีอยู่
        > ตัวตรวจ `scripts/validate-openapi.py` จะเตือนเรื่องนี้ทุกครั้งที่รัน
        >
        > **สองทางที่ต้องเลือก:** (ก) เพิ่ม `RPT.R4` ให้ครบ 7 รายการ หรือ
        > (ข) ถ้า R4 ถูกตัดออกจากขอบเขตจริง → ต้องแก้ `usecase-spec.md` และ PDF mapping ให้ตรงกัน
      operationId: listPermissions
      parameters:
        - name: module
          in: query
          schema: { $ref: '#/components/schemas/PermissionModule' }
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: รายชื่อสิทธิ์
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/roles/{roleId}/permissions:
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [M2 Master - RBAC]
      summary: ดูสิทธิ์ของบทบาท (UC-09)
      description: ใช้แสดงตารางติ๊กของหน้า Permission Matrix
      operationId: getRolePermissions
      responses:
        '200':
          description: สิทธิ์ของบทบาท
          content:
            application/json:
              schema:
                type: object
                properties:
                  roleId: { type: integer, format: int64, example: 1 }
                  roleName: { type: string, example: ADMIN }
                  permIds:
                    type: array
                    items: { type: integer, format: int64 }
                    description: seed ของ ADMIN มีทั้งหมด 21
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [M2 Master - RBAC]
      summary: บันทึก Permission Matrix (UC-09)
      description: |
        เขียนทับทั้งตาราง `role_permission` ของบทบาทนี้ (seed รวม 48 แถว)

        **BR-SEC-2** — บัญชี ADMIN ต้องมีสิทธิ์ครบ 21 เสมอ ห้ามติดถอดจนตัวเองล็อกออกจากระบบ
      operationId: setRolePermissions
      x-uc: UC-09
      x-permission: ROLE.EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
