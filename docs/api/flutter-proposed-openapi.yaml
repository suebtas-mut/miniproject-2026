openapi: 3.0.3

info:
  title: SHUTTLE BUS API
  version: 1.0.0
  description: |
    REST API สำหรับระบบจองรถตู้รับ–ส่งนักศึกษา มหาวิทยาลัยเทคโนโลยีมหาคร (ลาดกระบัง)
    หลักฐานประกอบ Sprint 2 — T-014

    ## ที่มาของสเปกนี้
    ทุก endpoint ในไฟล์นี้ผูกกับหลักฐาน 3 ชั้น และ **ตรวจสอบย้อนกลับได้**:

    | ชั้น | แหล่งอ้างอิง | สถานะ |
    |---|---|---|
    | Use Case | `docs/diagrams/usecase/usecase-spec.md` (UC-01…UC-30) | ✅ ปิดแล้ว (T-004) |
    | Database | `database/01_schema.sql` (20 ตาราง) | ✅ ผ่าน AR-02 13/13 (T-007) |
    | Seed | `database/02_seed_master.sql` + `03_seed_front.sql` | ✅ ผ่าน AR-02 21/22 (T-008) |

    ## กฎที่ยึดในการออกแบบ
    1. **ชื่อฟิลด์ตรงกับคอลัมน์จริงทุกตัว** — อ่านจาก `USER_TAB_COLUMNS` บน Oracle XE 21c โดยตรง
       (เช่น `stop_seq` ไม่ใช่ `no`, `sched_id` ไม่ใช่ `schedule_id`, `is_active` เป็นตัวเลข 0/1 ไม่ใช่ boolean)
    2. **ค่า enum ตรงกับ CHECK constraint จริง**
       - `booking.status` ∈ `reserved, checked_in, completed, cancelled, no_show`
       - `trip.status` ∈ `running, completed`
       - `*.is_active` ∈ `0, 1`
    3. **ทุก endpoint มี `x-uc` ระบุ Use Case** และ endpoint ที่บังคับกฎต้องมี `x-br` — ให้ตรวจได้ว่าไม่มี API ส่วนไหนลอย ไม่ผูกกับอะไรเลย
    4. **สิทธิ์ผูกกับ `permission.perm_code` จริง 21 ตัว** ไม่ใช้ชื่อสิทธิ์สมมติ
    5. รหัสผ่านไม่เคยส่งออก — มีแต่ `password_hash` ในตาราง และ API นี้ไม่มี field ใดคืนค่านั้น

    ## สิ่งที่ยังไม่กำหนด (รออาจารย์ตอบ — ดู Q-*)
    - **Q-B / Q-18** เวลาเส้นทางที่ 3 → seed ใช้ 15 นาที + `TODO(Q-B)` ส่วน endpoint รายงานจะอ่านค่าจาก
      `route.total_minutes` อยู่แล้ว จึง**ไม่ต้องแก้ API** เมื่ออาจารย์ตอบ
    - **Q-14** Oracle 19c หรือ 21c → ไม่กระทบ API (ทั้งสองรุ่นใช้ driver เดียวกัน)
    - **Q-20** เส้นทาง 1 ซ้ำจุด → ยังไม่มีข้อมูล จึงยังไม่มี endpoint ที่ต้องแก้

  contact:
    name: ทีม Mini Project 2026
    url: https://github.com/suebtas-mut/miniproject-2026

servers:
  - url: http://localhost:3000
    description: เครื่องนักศึกษา (Node.js + node-oracledb)
  - url: http://localhost:8080
    description: รันบน Flutter Emulator / Android Debug Bridge

tags:
  - name: M3 Auth
    description: เข้า–ออก–เปลี่ยนรหัส (UC-01…UC-03)
  - name: M1 Master - Employee
    description: พนักงาน / แผนก / ตำแหน่ง (UC-04…UC-06)
  - name: M2 Master - RBAC
    description: บทบาท / สิทธิ์ / Permission Matrix (UC-07…UC-10)
  - name: F1 Front - Route
    description: จุดหยุด / เส้นทาง (UC-11…UC-12)
  - name: F2 Front - Schedule
    description: ยานยนต์ / ตารางเวลา / Manifest (UC-13…UC-16)
  - name: B Booking
    description: จองที่นั่ง / QR (UC-17…UC-21)
  - name: D Driver
    description: งานคนขับ (UC-22…UC-26)
  - name: R Report
    description: รายงาน R1/R4/R6 + export (UC-27…UC-30)

security:
  - bearerAuth: []

paths:
  # ============================================================
  # M3 — AUTH (UC-01 … UC-03)
  # ============================================================
  /api/auth/login:
    post:
      tags: [M3 Auth]
      summary: เข้าสู่ระบบ (UC-01)
      description: |
        ตรวจ `username` + `password` กับตาราง `employee`

        **BR-SEC-1** — เทียบด้วย bcrypt เท่านั้น ห้ามเทียบรหัสผ่านตรง ๆ เด็ดขาด

        > ⚠️ **ข้อควรระวังจาก AR-02 ของ T-008:** ค่า `password_hash` ใน seed ปัจจุบันยาว 52–54 ตัว
        > ซึ่ง **ไม่ใช่ bcrypt ที่ถูกต้อง (ต้อง 60 ตัว)** และมีเพียง 4 ค่า unique
        > → ต้อง **ครอบ try/catch** รอบ bcrypt.compare ไว้ มิฉะนั้น library บางตัวจะ `throw`
        > ทำให้ API ตอบ **500** แทน **401**
        > รายละเอียดและวิธีแก้: `docs/reviews/t-007-schema-peer-review-sukhsorn.md` ส่วนที่ 4
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: ผู้ดูแลระบบ (จาก seed)
                value: { username: admin, password: any }
      responses:
        '200':
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: บัญชีถูกปิดใช้งาน (`employee.is_active = 0`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: ACCOUNT_LOCKED, message: 'บัญชีถูกปิดใช้งาน กรุณาติดต่อผู้ดูแล' }
        '500':
          description: bcrypt ตรวจไม่ได้ (ดูคำเตือนใน description) — ต้องถูกจับเป็น 401 ไม่ใช่หลุดเป็น 500
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/logout:
    post:
      tags: [M3 Auth]
      summary: ออกจากระบบ (UC-02)
      description: เพิ่ม JTI ของ token ลงตาราง `token_blacklist` เพื่อไม่ให้ใช้ซ้ำได้
      operationId: logout
      responses:
        '204': { description: ออกจากระบบสำเร็จ }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/change-password:
    post:
      tags: [M3 Auth]
      summary: เปลี่ยนรหัสผ่าน (UC-03)
      description: |
        ต้องยืนยันรหัสผ่านเดิม และรหัสใหม่ต้องผ่านเงื่อนไขความยาวขั้นต่ำ 8 ตัวอักษร
        เมื่อสำเร็จจะ **ยกเลิก token เดิมทั้งหมด** ของผู้ใช้
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, format: password, example: oldPassword }
                newPassword: { type: string, format: password, minLength: 8, example: newPassword }
      responses:
        '204': { description: เปลี่ยนรหัสผ่านสำเร็จ }
        '400':
          description: รหัสใหม่ยาวไม่ถึง 8 ตัวอักษร หรือรหัสใหม่เหมือนรหัสเดิม
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [M3 Auth]
      summary: ข้อมูลผู้ใช้ปัจจุบัน
      description: ใช้หลัง login เพื่อให้แอปสร้าง Dynamic Menu ตาม `permission.module` (5 โมดูล)
      operationId: getMe
      responses:
        '200':
          description: ข้อมูลผู้ใช้
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================================================
  # M1 — MASTER: EMPLOYEE / DEPARTMENT / POSITION (UC-04 … UC-06)
  # ============================================================
  /api/departments:
    get:
      tags: [M1 Master - Employee]
      summary: ดูรายชื่อแผนก (UC-05)
      description: |
        ชื่อแผนกใน seed เป็น **ค่าสมมติสำหรับการทดสอบเท่านั้น** เพราะ PDF ไม่ได้ระบุไว้
        (ข้อสังเกตข้อ 3 จาก AR-02 ของ T-008)
      operationId: listDepartments
      parameters:
        - $ref: '#/components/parameters/ActiveOnly'
      responses:
        '200':
          description: รายชื่อแผนก
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M1 Master - Employee]
      summary: เพิ่มแผนก (UC-05)
      operationId: createDepartment
      x-uc: UC-05
      x-permission: DEPT.EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deptName]
              properties:
                deptName: { type: string, maxLength: 100, example: วิศวกรรมซอฟต์แวร์ }
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: ชื่อแผนกซ้ำ (`uq_department_name`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/departments/{deptId}:
    parameters: [{ $ref: '#/components/parameters/DeptId' }]
    get:
      tags: [M1 Master - Employee]
      summary: ดูรายละเอียดแผนก (UC-05)
      operationId: getDepartment
      responses:
        '200':
          description: รายละเอียดแผนก
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [M1 Master - Employee]
      summary: แก้ไขแผนก (UC-05)
      operationId: updateDepartment
      x-uc: UC-05
      x-permission: DEPT.EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deptName]
              properties:
                deptName: { type: string, maxLength: 100 }
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ชื่อแผนกซ้ำ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [M1 Master - Employee]
      summary: ปิดใช้งานแผนก (UC-05)
      description: |
        **ไม่ใช้ hard delete** — เปลี่ยนเป็น `is_active = 0` เพราะตารางลูกอ้างอิงอยู่แล้ว
        ข้อสังเกตจาก AR-02: seed ไม่มีแผนกที่ `is_active = 0`
        → แนะนำให้เพิ่มข้อมูล 1 รายการเพื่อทดสอบ branch นี้
      operationId: deactivateDepartment
      x-uc: UC-05
      x-permission: DEPT.EDIT
      responses:
        '204': { description: ปิดใช้งานสำเร็จ }
        '409':
          description: ยังมีพนักงานในแผนกนี้ (`fk_employee_dept`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/positions:
    get:
      tags: [M1 Master - Employee]
      summary: ดูรายชื่อตำแหน่ง (UC-06)
      operationId: listPositions
      parameters:
        - name: deptId
          in: query
          schema: { type: integer, format: int64 }
          description: กรองเฉพาะตำแหน่งของแผนกที่ระบุ
      responses:
        '200':
          description: รายชื่อตำแหน่ง
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobPosition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M1 Master - Employee]
      summary: เพิ่มตำแหน่ง (UC-06)
      operationId: createPosition
      x-uc: UC-06
      x-permission: POS.EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionName, deptId]
              properties:
                positionName: { type: string, maxLength: 100, example: อาจารย์ประจำหลักสูตร }
                deptId: { type: integer, format: int64, example: 1 }
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ไม่พบ `deptId`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/positions/{positionId}:
    parameters:
      - name: positionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [M1 Master - Employee]
      summary: ดูรายละเอียดตำแหน่ง (UC-06)
      operationId: getPosition
      responses:
        '200':
          description: รายละเอียดตำแหน่ง
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosition' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [M1 Master - Employee]
      summary: แก้ไขตำแหน่ง (UC-06)
      operationId: updatePosition
      x-uc: UC-06
      x-permission: POS.EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionName, deptId]
              properties:
                positionName: { type: string, maxLength: 100 }
                deptId: { type: integer, format: int64 }
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [M1 Master - Employee]
      summary: ปิดใช้งานตำแหน่ง (UC-06)
      operationId: deactivatePosition
      x-uc: UC-06
      x-permission: POS.EDIT
      responses:
        '204': { description: ปิดใช้งานสำเร็จ }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/employees:
    get:
      tags: [M1 Master - Employee]
      summary: ดูรายชื่อพนักงานทั้งหมด (UC-04)
      description: หน้า A1 ของ Mockup — seed มี 15 คน
      operationId: listEmployees
      parameters:
        - $ref: '#/components/parameters/ActiveOnly'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string }
          description: ค้นหาจาก `emp_code` / `first_name` / `last_name` / `username`
        - name: deptId
          in: query
          schema: { type: integer, format: int64 }
        - name: positionId
          in: query
          schema: { type: integer, format: int64 }
        - name: roleId
          in: query
          schema: { type: integer, format: int64 }
          description: กรองตามบทบาท
      responses:
        '200':
          description: รายชื่อพนักงาน (แบบแบ่งหน้า)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedEmployeeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M1 Master - Employee]
      summary: เพิ่มพนักงาน (UC-04)
      description: |
        `password` ที่รับเข้าจะถูก **hash ด้วย bcrypt ทันที** แล้วเก็บลง `employee.password_hash`
        — ไม่มีทางที่รหัสผ่านต้นฉบับจะถูกบันทึก
      operationId: createEmployee
      x-uc: UC-04
      x-permission: EMP.EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '201':
          description: สร้างสำเร็จ (ไม่คืน `passwordHash`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`emp_code` หรือ `username` ซ้ำ"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/employees/{empId}:
    parameters:
      - name: empId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [M1 Master - Employee]
      summary: ดูรายละเอียดพนักงาน (UC-04)
      operationId: getEmployee
      responses:
        '200':
          description: รายละเอียดพนักงาน
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [M1 Master - Employee]
      summary: แก้ไขพนักงาน (UC-04)
      operationId: updateEmployee
      x-uc: UC-04
      x-permission: EMP.EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdate' }
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`username` ซ้ำ"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [M1 Master - Employee]
      summary: ปิดใช้งานพนักงาน (UC-04.3)
      description: เปลี่ยนเป็น `is_active = 0` ไม่ลบจริง เพราะตาราง `driver_assign` / `trip` อ้างอิงอยู่
      operationId: deactivateEmployee
      x-uc: UC-04.3
      x-permission: EMP.EDIT
      responses:
        '204': { description: ปิดใช้งานสำเร็จ }
        '409':
          description: พนักงานคนนี้ยังมีตารางเวลาที่กำลังใช้งานอยู่
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/employees/{empId}/roles:
    parameters:
      - name: empId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [M1 Master - Employee]
      summary: กำหนดบทบาทของพนักงาน (UC-10)
      description: |
        เขียนลงตาราง `employee_role` (seed มี 15 แถว = 15 พนักงาน 1 บทบาทต่อคน)
        เป็น **PUT แบบเต็ม (replace all)** ไม่ใช่ PATCH เพิ่มทีละรายการ
      operationId: setEmployeeRoles
      x-uc: UC-10
      x-permission: ROLE.EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds:
                  type: array
                  minItems: 1
                  items: { type: integer, format: int64 }
                  example: [3]
      responses:
        '200':
          description: กำหนดบทบาทสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  empId: { type: integer, format: int64 }
                  roleIds:
                    type: array
                    items: { type: integer, format: int64 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
