  /api/routes:
    get:
      tags: [F1 Front - Route]
      summary: ดูรายชื่อเส้นทาง (UC-12)
      description: |
        seed มี **2 เส้นทาง** (เส้นทางที่ 2 = 13 นาที, เส้นทางที่ 3 = 15 นาที)
        เส้นทางที่ 1 **ยังไม่ถูก seed** เพราะชื่อจุดซ้ำชน `uq_route_stop_uk` — รอคำตอบ Q-20
      operationId: listRoutes
      parameters:
        - $ref: '#/components/parameters/ActiveOnly'
        - name: includeStops
          in: query
          schema: { type: boolean, default: false }
          description: รวมจุดหยุดและ `travelMinutes` ของแต่ละจุด
      responses:
        '200':
          description: รายชื่อเส้นทาง
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Route' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [F1 Front - Route]
      summary: เพิ่มเส้นทาง (UC-12)
      description: |
        สร้างเส้นทางพร้อมจุดหยุดในคำสั่งเดียว (transaction เดียว)

        **BR-01** — `totalMinutes` **ต้องเท่ากับผลรวม `travelMinutes` ของทุกจุดเสมอ**
        API จะคำนวณให้จาก `stops` แล้วเทียบกับค่าที่ส่งมา
        ถ้าไม่ตรงจะตอบ 422 แทนที่จะบันทึกค่าที่ขัดแย้ง
      operationId: createRoute
      x-uc: UC-12
      x-permission: ROUTE.EDIT
      x-br: [BR-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteInput' }
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: 'BR-01 ไม่ผ่าน — `totalMinutes` ไม่เท่าผลรวมเวลาเดินทางของทุกจุด'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: BR01_TOTAL_MISMATCH
                message: 'totalMinutes (10) ไม่เท่าผลรวม travelMinutes (13)'
                details: { expected: 13, received: 10 }
        '409':
          description: 'มีจุดหยุดซ้ำในเส้นทางนี้ (`uq_route_stop_uk`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: DUPLICATE_STOP_IN_ROUTE
                message: 'จุดหยุดซ้ำภายในเส้นทางเดียวกัน'

  /api/routes/{routeId}:
    parameters:
      - name: routeId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [F1 Front - Route]
      summary: ดูรายละเอียดเส้นทาง (UC-12)
      operationId: getRoute
      responses:
        '200':
          description: รายละเอียดเส้นทาง
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [F1 Front - Route]
      summary: แก้ไขเส้นทาง (UC-12)
      operationId: updateRoute
      x-uc: UC-12
      x-permission: ROUTE.EDIT
      x-br: [BR-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteInput' }
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 'BR-01 ไม่ผ่าน'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

