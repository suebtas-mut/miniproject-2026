        sort_no:
          type: integer
          default: 0
          example: 20
      example:
        perm_code: "ROUTE.EDIT"
        perm_name: "แก้ไขเส้นทาง"
        module: "front"
        screen_key: "route"
        sort_no: 20

    PermissionMatrixRequest:
      type: object
      description: |
        บันทึกตารางติ๊ก Role x Permission (UC-09)
        ส่งเฉพาะช่องที่ **ติ๊กอยู่** server จะ MERGE เข้าไปใหม่ และ DELETE สิทธิ์เดิมที่ไม่อยู่ในรายการนี้
        ต้องทำเป็น Transaction เดียว (ข้อ 4 ของ P-04)
      required: ["role_id", "perm_ids"]
      properties:
        role_id:
          type: integer
          format: int64
          example: 2
        perm_ids:
          type: array
          description: "รายการ `perm_id` ที่ติ๊กอยู่ (อาจเป็นค่าว่าง = ถอดสิทธิ์ทั้งหมดของบทบาทนี้)"
          items:
            type: integer
            format: int64
          example: [1, 2, 5, 12]
      example:
        role_id: 2
        perm_ids: [1, 2, 5, 12]

