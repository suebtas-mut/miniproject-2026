        "500":
          $ref: "#/components/responses/InternalError"

  /booking/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: ["Booking"]
      operationId: "cancelBooking"
      summary: "UC-21 ยกเลิกการจอง + คืนที่นั่ง"
      description: |
        **Business Rule (B3)**
        1) ยกเลิกได้เฉพาะรายการ **ของตัวเอง** → ของคนอื่นตอบ 403 (UC-21 4a)
        2) **BR-08** ที่นั่งถูกคืนเข้ารอบทันที
           (`SUM` นับเฉพาะ `status='reserved'` จึงไม่ต้องแก้คอลัมน์ที่นั่ง)
        3) ASM-07-2: ยกเลิกได้ก่อนรถถึงจุดขึ้น 20 นาที เท่านั้น
        4) `status` เป็น `checked_in` / `completed` แล้วยกเลิกไม่ได้ → ตอบ 409 (UC-21 4c)

        **Transaction (P-04 ข้อ 4)**
        1. `SELECT ... FROM booking WHERE booking_id = :id FOR UPDATE`
        2. ตรวจเจ้าของ + เวลา 20 นาที + สถานะ
        3. `UPDATE booking SET status='cancelled', cancel_time = SYSTIMESTAMP WHERE booking_id = :id`
        4. COMMIT
      x-use-case: "UC-21"
      x-business-rules: ["BR-08"]
      x-transaction: "SELECT booking FOR UPDATE + UPDATE booking"
      responses:
        "200":
          description: "ยกเลิกสำเร็จ ที่นั่งถูกคืนเข้ารอบแล้ว (BR-08)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    example: "ยกเลิกการจองสำเร็จ ที่นั่งถูกคืนเข้ารอบแล้ว"
                  data:
                    $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "403 Forbidden - เป็นการจองของผู้ใช้อื่น (UC-21 4a)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "FORBIDDEN"
                  message: "ยกเลิกได้เฉพาะรายการของตัวเองเท่านั้น"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "409 Conflict - เลยกำหนดเวลา 20 นาที หรือสถานะไม่ใช่ reserved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "CANCEL_TOO_LATE"
                  message: "เลยกำหนดเวลายกเลิกแล้ว"
        "422":
          description: "422 - สถานะเป็น checked_in หรือ completed ยกเลิกไม่ได้ (UC-21 4c)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "INVALID_STATUS"
                  message: "การจองนี้เช็คอินไปแล้ว จึงยกเลิกไม่ได้"
        "500":
          $ref: "#/components/responses/InternalError"

