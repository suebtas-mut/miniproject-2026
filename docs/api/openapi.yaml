openapi: 3.0.3

info:
  title: "Shuttle Bus REST API - สำนักงานเขตหนองจอก"
  version: "1.0.0-draft"
  description: |
    สเปก REST API ของระบบรับส่งรถรับส่ง (Shuttle Bus) - Task **T-014** (Sprint 2)

    **แหล่งอ้างอิง (เรียงตามลำดับความสำคัญ)**
    1. `docs/diagrams/usecase/usecase-spec.md` (UC-01 ... UC-30)
    2. `docs/chapter-17-fullstack.md` ข้อ 17.5.2 (รายการ Endpoint)
    3. `docs/chapter-17-fullstack.md` ข้อ 17.4.5 (BR-01 ... BR-12)
    4. `database/01_schema.sql` (ชื่อตาราง/คอลัมน์จริงบน Oracle 19c)
    5. `docs/ai-prompts/P-04_rest-endpoint.md` (ข้อบังคับการเขียน Endpoint)

    **ข้อบังคับจาก P-04 ที่สะท้อนในสเปกนี้**
    - ใช้ `node-oracledb` **bind variable ทุก query** (`:param`) - ห้ามต่อสตริงเข้า SQL
    - ห้าม `SELECT *` - ทุก response ระบุคอลัมน์ชัดเจน
    - รายการยาวทุกตัวมี `?page=&limit=` และ `ORDER BY` ที่มีคอลัมน์ unique
    - Transaction เมื่อมากกว่า 1 statement (ดูหัวข้อ Transaction ในแต่ละ endpoint)
    - Error mapping แยกชัดเจน: 400 / 401 / 403 / 404 / 409 / 422 / 429 / 500
    - ห้ามส่ง stack trace หรือรายละเอียดของ Oracle กลับไปหา client
    - ไม่มี CORS - client เป็น Flutter (มือถือ/แท็บเล็ต) เท่านั้น ไม่มี Web/React (R-07)

    **รูปแบบ Response (17.5.1)**
    - สำเร็จ: `{ "success": true, "data": { }, "message": "..." }`
    - ผิดพลาด: `{ "success": false, "error": { "code": "SEAT_FULL", "message": "...", "details": [] } }`
    - รายการแบ่งหน้าเพิ่ม `meta: { "page": 1, "limit": 20, "total": 137, "total_pages": 7 }`

    **สิ่งที่สเปกนี้ยังไม่กำหนด (รออาจารย์ยืนยัน - P-04 ข้อ 9 ห้ามตัดสินใจเอง)**
    - **Q22** (UC-10 กำหนดบทบาทให้พนักงาน) - Use Case ไม่ระบุ API path และ 17.5.2 ไม่มี endpoint นี้ จึงยังไม่เขียนในสเปก
    - **Q23** (UC-14.2 แก้ไขเวลาออกของรอบ) - ต้องแก้ `schedule.depart_at` แต่ 17.5.2 มีแค่ POST/GET/DELETE `/schedules` ยังไม่เขียนในสเปก
    - **Q24** (UC-08 แก้ไข/ลบสิทธิ์) - Use Case ระบุเพิ่ม/แก้/ลบ `permission` แต่ 17.5.2 มีแค่ GET/POST `/permissions` ยังไม่เขียนในสเปก

    **รายงานที่ไม่ได้ทำจริง** - R2, R3, R5, R7 คืน `501 Not Implemented` และไม่มีหน้าจอในแอป
    (ตามเงื่อนไข PDF: เลือก R1 + R4 + R6 ได้ 24 คะแนน)
    501 ตั้งใจให้เป็น response เดียวของ 4 endpoint นี้ ตาม 17.5.2
    ("ที่ไม่ได้ทำจริง คืนค่า 501 Not Implemented") จึงไม่มี 2XX ใน 4 operations นี้

    **UC-30 (หน้าจอรายงาน + Export PNG/PDF) ไม่มี REST endpoint ของตัวเอง**
    เป็น Use Case ระดับหน้าจอ ใช้ข้อมูลจาก GET ของ R1 / R4 / R6
    (เลือกช่วงวันที่ → Backend คืนข้อมูล + กราฟ → Export เป็น PNG/PDF ฝั่งแอป `fl_chart`)
    จึงระบุไว้ที่ `x-use-case` ของ 3 endpoint ดังกล่าว ไม่ใช่ endpoint แยก

    **หมายเหตุเรื่องรหัสผ่าน** - ตัวอย่าง payload ในสเปกนี้ใช้ค่าสมมติ ไม่ใช่รหัสผ่านจริง
    และ seed data ปัจจุบันยัง Login ไม่ได้ (bcrypt placeholder) - รอ T-011
  contact:
    name: "นายเก่งกาญ เชี่ยวชาญ"
    x-ai-assisted: true
  license:
    name: "Academic Project - Mini Shuttle Bus"
    url: "https://github.com/suebtas-mut/miniproject-2026"

servers:
  - url: "http://{host}:3000/api/v1"
    description: "เครื่องที่รัน Node.js - dev ใช้ localhost, เครื่องจริงใส่ IP (ตาม 17.5.1)"
    variables:
      host:
        default: "localhost"
        description: "localhost ตอน dev / IP ของเครื่องที่รัน Server ตอนใช้งานจริง"

tags:
  - name: "Auth"
    description: "UC-01 ... UC-03 - Login / Logout / เปลี่ยนรหัสผ่าน (M3)"
  - name: "Master"
    description: "UC-04 ... UC-06 - พนักงาน / แผนก / ตำแหน่ง (M1)"
  - name: "RBAC"
    description: "UC-07 ... UC-10 - บทบาท / สิทธิ์ / Permission Matrix (M2)"
  - name: "Front"
    description: "UC-11 ... UC-16 - จุดจอด / เส้นทาง / รอบเวลา / รถ / มอบหมาย (F1, F2)"
  - name: "Booking"
    description: "UC-17 ... UC-21 - จอง / My Booking / QR / ยกเลิก (B1 - B3)"
  - name: "Driver"
    description: "UC-22 ... UC-26 - ตารางงาน / เริ่มเดินทาง / Manifest / สแกน QR / ปิดรอบ (D1 - D4)"
  - name: "Report"
    description: "UC-27 ... UC-30 - R1 + R4 + R6 (ทำจริง) / R2,R3,R5,R7 คืน 501"

security:
  - bearerAuth: []

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>`

        Token มีอายุ 2 ชั่วโมง (UC-01) และมี `jti` เพื่อให้ revoke ได้
        เมื่อ Logout ระบบเพิ่ม `jti` ลงตาราง `token_blacklist`
        สิทธิ์ (`perm_code`) อ่านจากฐานข้อมูลทุกครั้งที่ middleware ตรวจ ไม่ใช่จาก token
        ห้ามมีการ fix สิทธิ์ตามชื่อบทบาทในโค้ด (UC-09)

  parameters:
    IdParam:
      name: "id"
      in: path
      required: true
      description: "รหัสประจำรายการ (IDENTITY จาก Oracle)"
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

    SchedIdParam:
      name: "schedId"
      in: path
      required: true
      description: "รหัสรอบเวลา (schedule.sched_id)"
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

    TripIdParam:
      name: "tripId"
      in: path
      required: true
      description: "รหัสการเดินรถ (trip.trip_id)"
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

    PageParam:
      name: "page"
      in: query
      required: false
      description: "เลขหน้า เริ่มที่ 1"
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: "limit"
      in: query
      required: false
      description: "จำนวนรายการต่อหน้า"
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    DateParam:
      name: "date"
      in: query
      required: true
      description: "วันที่ให้บริการ (schedule.service_date) รูปแบบ YYYY-MM-DD"
      schema:
        type: string
        format: date
        example: "2026-10-02"

    FromParam:
      name: "from"
      in: query
      required: true
      description: "วันที่เริ่มต้น (รวม) รูปแบบ YYYY-MM-DD"
      schema:
        type: string
        format: date
        example: "2026-10-01"

    ToParam:
      name: "to"
      in: query
      required: true
      description: "วันที่สิ้นสุด (รวม) รูปแบบ YYYY-MM-DD"
      schema:
        type: string
        format: date
        example: "2026-10-31"

    YearParam:
      name: "year"
      in: query
      required: true
      description: "ปี พ.ศ. ที่ต้องการดูรายงาน (UC-27 ใช้ปี 2568)"
      schema:
        type: integer
        minimum: 2500
        maximum: 2600
        example: 2568

    BoardStopParam:
      name: "board_stop"
      in: query
      required: true
      description: "รหัสจุดขึ้นรถ (stop.stop_id) - BR-11 ต้องอยู่ก่อนจุดลง"
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

    AlightStopParam:
      name: "alight_stop"
      in: query
      required: true
      description: "รหัสจุดลงรถ (stop.stop_id) - BR-12 ต้องอยู่ในเส้นทางของรอบนั้น"
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 4

    StatusParam:
      name: "status"
      in: query
      required: false
      description: |
        กรองสถานะการจอง (UC-19 แบ่งเป็น 3 แท็บ)
        - `upcoming` = กำลังจะถึง (`reserved` ที่ยังไม่ถึงวัน)
        - `completed` = เดินทางแล้ว (`completed`)
        - `cancelled` = ยกเลิก (`cancelled`)
      schema:
        type: string
        enum: ["upcoming", "completed", "cancelled", "all"]
        default: "upcoming"

  responses:
    BadRequest:
      description: "400 Bad Request - ข้อมูลที่ส่งมาไม่ผ่านการ validate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: "VALIDATION_ERROR"
              message: "ข้อมูลที่ส่งมาไม่ถูกต้อง"
              details:
                - field: "seats"
                  message: "ต้องมีค่าระหว่าง 1 ถึง 4 (BR-06)"

    Unauthorized:
      description: "401 Unauthorized - ไม่มี token / token หมดอายุ / ถูก revoke ใน token_blacklist"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: "UNAUTHORIZED"
              message: "กรุณาเข้าสู่ระบบใหม่"

    Forbidden:
      description: "403 Forbidden - ไม่มีสิทธิ์ตาม role_permission หรือไม่ใช่เจ้าของข้อมูล"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: "FORBIDDEN"
              message: "ไม่มีสิทธิ์เข้าถึงส่วนนี้"

    NotFound:
      description: "404 Not Found - ไม่พบข้อมูล"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: "NOT_FOUND"
              message: "ไม่พบข้อมูลที่ต้องการ"

    Conflict:
      description: "409 Conflict - ข้อมูลซ้ำตาม UNIQUE constraint หรือทรับซ้อนเวลา"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: "DUPLICATED"
              message: "ชื่อผู้ใช้นี้ถูกใช้แล้ว"

    Unprocessable:
      description: "422 Unprocessable Entity - ผ่าน validate แต่ผิดกฎทางธุรกิจหรือผิด Foreign Key"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: "FK_VIOLATION"
              message: "ข้อมูลอ้างอิงไม่ถูกต้อง (เช่น ยังมีพนักงานสังกัดในแผนกนี้)"

    RateLimited:
      description: "429 Too Many Requests - เข้าสู่ระบบผิดเกิน 5 ครั้งติดกัน (UC-01 A2)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: "TOO_MANY_ATTEMPTS"
              message: "พยายามเข้าสู่ระบบหลายครั้งเกินไป กรุณารอสักครู่"

    InternalError:
      description: |
        500 Internal Server Error - ผิดตาราง/คอลัมน์ หรือฐานข้อมูลมีปัญหา

        ข้อ 18 (P-04): ห้ามส่ง stack trace หรือรายละเอียดของ Oracle กลับไปหา client
        ต้อง log ไว้ฝั่ง server เท่านั้น
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: "INTERNAL_ERROR"
              message: "เกิดข้อผิดพลาดภายในระบบ กรุณาลองใหม่อีกครั้ง"

    NotImplemented:
      description: "501 Not Implemented - รายงานที่ไม่ได้เลือกทำจริง (R2, R3, R5, R7)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: "REPORT_NOT_SELECTED"
              message: "รายงานนี้ไม่ได้อยู่ในชุดที่ทีมเลือกทำจริง (R1 + R4 + R6)"

  schemas:

    # ---------- กล่อง Response กลาง ----------

    ErrorEnvelope:
      type: object
      required: ["success", "error"]
      properties:
        success:
          type: boolean
          enum: [false]
          example: false
        error:
          $ref: "#/components/schemas/ErrorBody"
      example:
        success: false
        error:
          code: "SEAT_FULL"
          message: "ที่นั่งไม่เพียงพอ"
          details:
            - field: "seats"
              message: "เหลือที่นั่งว่าง 1 ที่นั่ง (BR-07)"

    ErrorBody:
      type: object
      required: ["code", "message"]
      properties:
        code:
          type: string
          description: "รหัสข้อผิดพลาดคงที่ ใช้แสดงผลและแปลงเป็นภาษาไทยในแอป"
          example: "SEAT_FULL"
        message:
          type: string
          description: "ข้อความภาษาไทยสำหรับผู้ใช้"
          example: "ที่นั่งไม่เพียงพอ"
        details:
          type: array
          description: "รายละเอียดราย field (มีเฉพาะ validation error)"
          items:
            type: object
            properties:
              field:
                type: string
                example: "seats"
              message:
                type: string
                example: "เหลือที่นั่งว่าง 1 ที่นั่ง"

    PaginationMeta:
      type: object
      description: "ข้อมูลการแบ่งหน้า - คำนวณจาก `OFFSET .. FETCH NEXT .. ROWS ONLY` (Oracle 12c+)"
      required: ["page", "limit", "total", "total_pages"]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          description: "จำนวนรายการทั้งหมด"
          example: 137
        total_pages:
          type: integer
          example: 7
      example:
        page: 1
        limit: 20
        total: 137
        total_pages: 7

    # ---------- UC-01 / UC-03 : Auth ----------

    LoginRequest:
      type: object
      required: ["username", "password"]
      properties:
        username:
          type: string
          maxLength: 50
          example: "admin"
        password:
          type: string
          format: password
          minLength: 8
          description: "ส่งเป็น plaintext ผ่าน HTTPS แล้ว hash ด้วย bcrypt ฝั่ง server เท่านั้น"
          example: "<รหัสผ่านของคุณ>"
      example:
        username: "admin"
        password: "<รหัสผ่านของคุณ>"

    LoginResponse:
      type: object
      description: "payload ภายใน `data` ของ `POST /auth/login` (envelope อยู่ที่ระดับ path)"
      required: ["access_token", "token_type", "expires_in", "employee", "permissions", "menus"]
      properties:
        access_token:
          type: string
          description: "JWT มีอายุ 2 ชั่วโมง มี claim `jti` สำหรับ revoke"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIxMiJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
        token_type:
          type: string
          enum: ["Bearer"]
          example: "Bearer"
        expires_in:
          type: integer
          description: "อายุ token เป็นวินาที (2 ชั่วโมง = 7200)"
          example: 7200
        employee:
          $ref: "#/components/schemas/EmployeeProfile"
        permissions:
          type: array
          description: "รหัสสิทธิ์ทั้งหมดที่อ่านจาก DB (R-03) ไม่ hardcode"
          items:
            type: string
          example: ["EMPLOYEE.VIEW", "EMPLOYEE.EDIT", "ROUTE.EDIT"]
        menus:
          type: array
          description: "เมนู Dynamic สร้างจาก `permission.screen_key` เรียงตาม `sort_no`"
          items:
            $ref: "#/components/schemas/MenuItem"
      example:
        access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIxMiJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
        token_type: "Bearer"
        expires_in: 7200
        employee:
          emp_id: 1
          emp_code: "EMP001"
          first_name: "ระบบ"
          last_name: "ผู้ดูแลระบบ"
          username: "admin"
          is_active: 1
          roles: ["ADMIN"]
        permissions: ["EMPLOYEE.VIEW", "EMPLOYEE.EDIT", "ROUTE.EDIT"]
        menus:
          - screen_key: "employee"
            label: "พนักงาน"
            sort_no: 10

    MenuItem:
      type: object
      description: "รายการเมนู Dynamic ที่ client ใช้สร้างเมนู (17.6.3) ไม่ต้องแก้โค้ด Dart เมื่อเปลี่ยนสิทธิ์"
      required: ["screen_key", "label", "sort_no"]
      properties:
        screen_key:
          type: string
          maxLength: 80
          example: "employee"
        label:
          type: string
          example: "พนักงาน"
        icon:
          type: string
          nullable: true
          example: "people"
        sort_no:
          type: integer
          description: "ลำดับเมนู (เลขน้อยก่อน)"
          example: 10

    ChangePasswordRequest:
      type: object
      required: ["old_password", "new_password", "confirm_password"]
      properties:
        old_password:
          type: string
          format: password
          example: "<รหัสผ่านเดิม>"
        new_password:
          type: string
          format: password
          minLength: 8
          description: "bcrypt.hash ฝั่ง server ห้ามเก็บ plaintext (R-04)"
          example: "<รหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร>"
        confirm_password:
          type: string
          format: password
          minLength: 8
          example: "<รหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร>"
      example:
        old_password: "<รหัสผ่านเดิม>"
        new_password: "<รหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร>"
        confirm_password: "<รหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร>"

    # ---------- UC-04 / UC-05 / UC-06 : Master ----------

    Department:
      type: object
      description: "ตาราง `department` - 3 คอลัมน์"
      required: ["dept_id", "dept_name"]
      properties:
        dept_id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        dept_name:
          type: string
          maxLength: 120
          description: "ห้ามซ้ำ (uq_department_name)"
          example: "ฝ่ายบริหาร"
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-28T02:00:00.000Z"
      example:
        dept_id: 1
