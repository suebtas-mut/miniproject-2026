  /report/daily-by-route:
    get:
      tags: ["Report"]
      operationId: "reportDailyByRoute"
      summary: "UC-28 / R4 จำนวนผู้ใช้รายวันแยกตามเส้นทาง (ทำจริง)"
      description: |
        **R4 ✅** - จำนวนผู้ใช้รายวัน แยกตามเส้นทาง ตามเงื่อนไข PDF

        **ข้อควรระวัง (UC-28)** - การนับต้องกรองวันให้ครบทุกวันจริง
        ถ้าเขียน SQL ตาม `schedule.service_date` อย่างเดียว วันที่ไม่มีรอบเวลา
        จะหายไปจากรายงานทั้งที่รายงานต้องแสดงทุกวันของช่วงที่เลือก
        → ต้องสร้างรายการวันที่ทั้งช่วงก่อน แล้ว LEFT JOIN ผลการจอง
        วันไหนไม่มีข้อมูลให้แสดง 0 ไม่ใช่ตัดแถวทิ้ง

        นิยามที่ใช้
        - 1 วัน = `schedule.service_date` ของรอบที่จองสำเร็จ (`status IN ('reserved','checked_in','completed')`)
        - 1 ผู้ใช้ = `COUNT(DISTINCT b.cust_id)` — นับคน ไม่ใช่จำนวนการจอง
        - พลาดรถ = `booking.status = 'no_show'` แยกออกจากผู้ใช้จริง
