  # ==================================================================
  # BOOKING  —  UC-17 ... UC-21   (B1 - B3)
  # ==================================================================

  /booking/available:
    get:
      tags: ["Booking"]
      operationId: "getAvailableSchedules"
      summary: "UC-17 รอบเวลาที่จองได้จริง"
      description: |
        คืนเฉพาะรอบที่ผ่านทุกเงื่อนไข ถ้าไม่มีรอบที่ผ่านให้คืน array ว่าง
        (แอปแสดง "ไม่มีรอบที่จองได้ในวันนี้" — UC-17 5a)

        **Business Rule ที่ต้องกรองใน query เดียว**
        - BR-05: `schedule_stop.arrive_at - SYSTIMESTAMP >= INTERVAL '20' MINUTE`
          นับจากเวลาถึง **จุดขึ้นรถ** ไม่ใช่เวลาออกจากจุดเริ่มต้น
        - BR-11: `board_seq < alight_seq` (จุดขึ้นต้องอยู่ก่อนจุดลง)
        - BR-12: ทั้งสองจุดต้องอยู่ใน `schedule_stop` ของรอบนั้น
        - BR-07: `capacity - NVL(SUM(booking.seats),0)` เฉพาะ `status='reserved'` > 0

        ⛔ ห้ามผ่าน string ใน SQL — ทุกค่าจาก query string ต้องเป็น bind variable
        ใช้ `:boardStop`, `:alightStop`, `:serviceDate`
      x-use-case: "UC-17"
      x-business-rules: ["BR-05", "BR-07", "BR-11", "BR-12"]
      parameters:
        - $ref: "#/components/parameters/BoardStopParam"
        - $ref: "#/components/parameters/AlightStopParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: "รายการรอบที่จองได้"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AvailableSchedule"
              example:
                success: true
                data:
                  - sched_id: 1
                    route_id: 2
                    route_name: "เส้นทาง 2"
                    service_date: "2026-10-02"
                    depart_at: "2026-10-02T09:30:00.000Z"
                    board_stop:
                      stop_id: 1
                      stop_name: "มหาวิทยาลัยเทคโนโลยีมหานคร"
                      stop_seq: 1
                    alight_stop:
                      stop_id: 4
                      stop_name: "หอพักนักศึกษา"
                      stop_seq: 2
                    board_arrive_at: "2026-10-02T09:30:00.000Z"
                    minutes_until_board: 45
                    seats_total: 9
                    seats_reserved: 3
                    seats_available: 6
                    plate_no: "สย 2591"
        "400":
          description: "400 Bad Request - ขาดพารามิเตอร์ หรือจุดลงอยู่ก่อนจุดขึ้น (BR-11, UC-17 3a)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "STOP_ORDER_INVALID"
                  message: "จุดจอดลงต้องอยู่หลังจุดจอดขึ้น"
        "401":
          description: "401 Unauthorized - ต้อง Login ก่อนจอง (B1 ข้อ 1)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "UNAUTHORIZED"
                  message: "กรุณาเข้าสู่ระบบก่อนเลือกรอบเวลา"
        "500":
          $ref: "#/components/responses/InternalError"

  /booking:
    post:
      tags: ["Booking"]
      operationId: "createBooking"
      summary: "UC-18 เลือกจำนวนที่นั่งและยืนยันการจอง"
      description: |
        **Business Rule (B1)** — server ตรวจซ้ำอีกครั้งฝั่ง server ไม่เชื่อค่าจาก client
        - BR-05: ต้องจองก่อนเวลารถถึงจุดขึ้นอย่างน้อย 20 นาที
        - BR-06: `seats` ระหว่าง 1 ถึง 4 (ck_booking_seats) - เกินให้ปฏิเสธทันที
        - BR-07: `capacity - NVL(SUM(booking.seats),0)` ต้องพอ

        **Transaction (P-04 ข้อ 4) — ลำดับสำคัญ**
        1. `SELECT ... FROM schedule WHERE sched_id = :schedId FOR UPDATE NOWAIT`
        2. ตรวจ BR-05 / BR-06 / BR-07 แบบ aggregate
        3. `booking_code` จาก `seq_booking_code.NEXTVAL` + `qr_token` สุ่มใหม่
        4. INSERT `booking` → COMMIT

        **กับดัก Oracle (UC-18)** ⛔ ห้ามใช้ `FOR UPDATE` กับ aggregate
        (`SUM`/`GROUP BY`) เพราะจะได้ ORA-02014 — ต้องล็อกแถว `schedule` ก่อน แล้วค่อยนับ
        และใช้ `NVL(SUM(...),0)` เพราะ Oracle คืน `NULL` ไม่ใช่ 0
        ถ้าล็อกไม่ได้เพราะมีคนจองพร้อมกัน → ORA-00054 → ตอบ 409 (ไม่ค้าง) — UC-18 5a
      x-use-case: "UC-18"
      x-business-rules: ["BR-05", "BR-06", "BR-07"]
      x-transaction: "SELECT schedule FOR UPDATE NOWAIT + INSERT booking"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
            example:
              sched_id: 1
              board_stop_id: 1
              alight_stop_id: 4
              seats: 2
      responses:
        "201":
          description: "จองสำเร็จ พร้อม QR Code (UC-20)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    example: "จองสำเร็จ"
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Booking"
                      - type: object
                        description: "เพิ่ม QR สำหรับแสดงทันทีหลังจองสำเร็จ (UC-18 ขั้นที่ 7)"
                        properties:
                          qr_token:
                            type: string
                            example: "b7f3c1a9d24e4f8ba1c6e0d5f9a2b31"
                          qr_image:
                            type: string
                            format: byte
                            example: "iVBORw0KGgoAAAANSUhEUg=="
              example:
                success: true
                message: "จองสำเร็จ"
                data:
                  booking_id: 1
                  booking_code: "BK68000001"
                  cust_id: 7
                  sched_id: 1
                  board_stop_id: 1
                  board_stop_name: "มหาวิทยาลัยเทคโนโลยีมหานคร"
                  alight_stop_id: 4
                  alight_stop_name: "หอพักนักศึกษา"
                  seats: 2
                  status: "reserved"
                  book_time: "2026-10-01T03:00:00.000Z"
                  cancel_time: null
                  qr_token: "b7f3c1a9d24e4f8ba1c6e0d5f9a2b31"
                  qr_image: "iVBORw0KGgoAAAANSUhEUg=="
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "409 Conflict - ที่นั่งเต็ม (BR-07) หรือแถว schedule ถูกล็อก (ORA-00054)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "SEAT_FULL"
                  message: "ที่นั่งไม่เพียงพอ"
                  details:
                    - field: "seats"
                      message: "เหลือที่นั่งว่าง 1 ที่นั่ง"
        "422":
          description: "422 - จุดขึ้น/ลงไม่อยู่ในเส้นทางของรอบนี้ (BR-12) หรือผิดลำดับ (BR-11)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "STOP_NOT_IN_ROUTE"
                  message: "จุดจอดที่เลือกไม่อยู่ในเส้นทางของรอบเวลานี้"
        "500":
          $ref: "#/components/responses/InternalError"

