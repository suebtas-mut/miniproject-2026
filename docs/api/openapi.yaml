          readOnly: true
          description: "BR-02 = depart_at + SUM(travel_minutes) ถึงจุดนี้"
          example: "2026-10-02T09:30:00.000Z"
        dwell_minutes:
          type: integer
          minimum: 0
          default: 0
          example: 0
      example:
        sched_stop_id: 1
        sched_id: 1
        stop_id: 1
        stop_name: "มหาวิทยาลัยเทคโนโลยีมหานคร"
        stop_seq: 1
        arrive_at: "2026-10-02T09:30:00.000Z"
        dwell_minutes: 0

    Schedule:
      type: object
      description: "ตาราง `schedule` - UNIQUE (route_id, depart_at) กันสร้างรอบซ้ำ (UC-14 ข้อ 6)"
      required: ["sched_id", "route_id", "service_date", "depart_at", "is_active"]
      properties:
        sched_id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        route_id:
          type: integer
          format: int64
          example: 2
        route_name:
          type: string
          nullable: true
          readOnly: true
          description: "รวมมาให้แสดงผล (join route)"
          example: "เส้นทาง 2"
        service_date:
          type: string
          format: date
          description: "วันที่ให้บริการ"
          example: "2026-10-02"
        depart_at:
          type: string
          format: date-time
          description: "วัน + เวลาออกจากจุดเริ่มต้น (เก็บเป็น TIMESTAMP เต็ม)"
          example: "2026-10-02T09:30:00.000Z"
        end_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: "BR-04 ใช้ช่วงชนกัน = [depart_at, depart_at + route.total_minutes]"
          example: "2026-10-02T09:43:00.000Z"
        is_active:
          type: integer
          format: int32
          enum: [0, 1]
          description: "1 = เปิดจอง, 0 = ปิดรอบ"
          example: 1
        stop_count:
          type: integer
          readOnly: true
          example: 4
        driver:
          type: object
          nullable: true
          description: "คนขับที่มอบหมายแล้ว (UC-15) ยังไม่มีจะเป็น null"
          properties:
            emp_id:
              type: integer
              format: int64
              example: 5
            first_name:
              type: string
              example: "ประเสริฐ"
            last_name:
              type: string
              example: "ขับรถ"
        vehicle:
          type: object
          nullable: true
          description: "รถที่มอบหมายแล้ว (UC-16) ยังไม่มีจะเป็น null"
          properties:
            veh_id:
              type: integer
              format: int64
              example: 1
            plate_no:
              type: string
              example: "สย 2591"
            vtype_name:
              type: string
              example: "รถตู้ 9 ที่นั่ง"
            capacity:
              type: integer
              example: 9
        seats_total:
          type: integer
          nullable: true
          readOnly: true
          description: "capacity ของรถที่มอบหมาย"
          example: 9
        seats_reserved:
          type: integer
          nullable: true
          readOnly: true
          description: "SUM(booking.seats) ที่ status = reserved (BR-07)"
          example: 3
        seats_available:
          type: integer
          nullable: true
          readOnly: true
          description: "ที่นั่งว่าง = seats_total - seats_reserved (BR-07)"
          example: 6
        stops:
          type: array
          nullable: true
          description: "เวลาถึงทุกจุดจอด (BR-02) - คืนมาเมื่อใช้ `GET /schedules/{id}`"
          items:
            $ref: "#/components/schemas/ScheduleStop"
      example:
        sched_id: 1
        route_id: 2
        route_name: "เส้นทาง 2"
        service_date: "2026-10-02"
        depart_at: "2026-10-02T09:30:00.000Z"
        end_at: "2026-10-02T09:43:00.000Z"
        is_active: 1
        stop_count: 4
        driver:
          emp_id: 5
          first_name: "ประเสริฐ"
          last_name: "ขับรถ"
        vehicle:
          veh_id: 1
          plate_no: "สย 2591"
          vtype_name: "รถตู้ 9 ที่นั่ง"
          capacity: 9
        seats_total: 9
        seats_reserved: 3
        seats_available: 6

    ScheduleRequest:
      type: object
      description: "สร้างรอบเวลา (UC-14.1) - server สร้าง `schedule_stop` ให้ครบทุกจุดจอดอัตโนมัติ"
      required: ["route_id", "service_date", "depart_at"]
      properties:
        route_id:
          type: integer
          format: int64
          description: "ต้องมีจุดจอดครบแล้วและ route.total_minutes ถูกต้อง"
          example: 2
        service_date:
          type: string
          format: date
          example: "2026-10-02"
        depart_at:
          type: string
          format: date-time
          description: "ตัวอย่างรอบเวลาจากเอกสาร: 09:30 / 11:00 / 13:00 / 15:00"
          example: "2026-10-02T09:30:00.000Z"
        is_active:
          type: integer
          format: int32
          enum: [0, 1]
          default: 1
          example: 1
      example:
        route_id: 2
        service_date: "2026-10-02"
        depart_at: "2026-10-02T09:30:00.000Z"
        is_active: 1

    # ---------- UC-15 / UC-16 : Assign ----------

    AssignDriverRequest:
      type: object
      description: "มอบหมายคนขับให้รอบ (UC-15) - server ตรวจ BR-04 ภายใน Transaction"
      required: ["emp_id"]
      properties:
        emp_id:
          type: integer
          format: int64
          description: "ต้องเป็นพนักงานที่มี Role = DRIVER ไม่ใช่ก็ตอบ 422"
          example: 5
      example:
        emp_id: 5

    AssignVehicleRequest:
      type: object
      description: "มอบหมายรถให้รอบ (UC-16) - server ตรวจ BR-04 ภายใน Transaction"
      required: ["veh_id"]
      properties:
        veh_id:
          type: integer
          format: int64
          description: "ต้องเป็นรถที่ is_active = 1 ไม่ใช่ก็ตอบ 422"
          example: 1
      example:
        veh_id: 1

    # ---------- UC-17 ... UC-21 : Booking ----------

    AvailableSchedule:
      type: object
      description: "รอบที่จองได้จริง (UC-17) - ผ่าน BR-05, BR-07, BR-11, BR-12 ครบแล้วเท่านั้น"
      required: ["sched_id", "route_id", "service_date", "depart_at", "board_stop", "alight_stop", "seats_available"]
      properties:
        sched_id:
          type: integer
          format: int64
          example: 1
        route_id:
          type: integer
          format: int64
          example: 2
        route_name:
          type: string
          nullable: true
          example: "เส้นทาง 2"
        service_date:
          type: string
          format: date
          example: "2026-10-02"
        depart_at:
          type: string
          format: date-time
          example: "2026-10-02T09:30:00.000Z"
        board_stop:
          $ref: "#/components/schemas/StopRef"
        alight_stop:
          $ref: "#/components/schemas/StopRef"
        board_arrive_at:
          type: string
          format: date-time
          description: "เวลาถึงจุดขึ้น - BR-05 นับจากเวลานี้ ไม่ใช่เวลาออกจากจุดเริ่มต้น"
          example: "2026-10-02T09:30:00.000Z"
        minutes_until_board:
          type: number
          description: "นาทีที่เหลือก่อนถึงจุดขึ้น - ต้องมากกว่า 20 นาที (BR-05) ถึงแสดงผล"
          example: 45
        seats_total:
          type: integer
          example: 9
        seats_reserved:
          type: integer
          example: 3
        seats_available:
          type: integer
          description: "capacity - NVL(SUM(booking.seats),0) เฉพาะ status = reserved (BR-07)"
          example: 6
        plate_no:
          type: string
          nullable: true
          example: "สย 2591"
      example:
        sched_id: 1
        route_id: 2
        route_name: "เส้นทาง 2"
        service_date: "2026-10-02"
        depart_at: "2026-10-02T09:30:00.000Z"
        board_stop:
          stop_id: 1
          stop_name: "มหาวิทยาลัยเทคโนโลยีมหานคร"
        alight_stop:
          stop_id: 4
          stop_name: "หอพักนักศึกษา"
        board_arrive_at: "2026-10-02T09:30:00.000Z"
        minutes_until_board: 45
        seats_total: 9
        seats_reserved: 3
        seats_available: 6
        plate_no: "สย 2591"

    StopRef:
      type: object
      required: ["stop_id", "stop_name"]
      properties:
        stop_id:
          type: integer
          format: int64
          example: 1
        stop_name:
          type: string
          example: "มหาวิทยาลัยเทคโนโลยีมหานคร"
        stop_seq:
          type: integer
          nullable: true
          description: "ลำดับจุดจอดในรอบนั้น - ใช้ตรวจ BR-11"
          example: 1
      example:
        stop_id: 1
        stop_name: "มหาวิทยาลัยเทคโนโลยีมหานคร"
        stop_seq: 1

    BookingRequest:
      type: object
      description: "สร้างการจอง (UC-18) - server ตรวจ BR-05/06/07 ซ้ำอีกครั้งฝั่ง server"
      required: ["sched_id", "board_stop_id", "alight_stop_id", "seats"]
      properties:
        sched_id:
          type: integer
          format: int64
          example: 1
        board_stop_id:
          type: integer
          format: int64
          example: 1
        alight_stop_id:
          type: integer
          format: int64
          example: 4
        seats:
          type: integer
          minimum: 1
          maximum: 4
          description: "BR-06 ck_booking_seats บังคับ 1-4 ที่นั่ง"
          example: 2
      example:
        sched_id: 1
        board_stop_id: 1
        alight_stop_id: 4
        seats: 2

    Booking:
      type: object
      description: "ตาราง `booking` - 5 สถานะ: reserved, checked_in, completed, cancelled, no_show"
      required: ["booking_id", "booking_code", "cust_id", "sched_id", "board_stop_id", "alight_stop_id", "seats", "status"]
      properties:
        booking_id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        booking_code:
          type: string
          maxLength: 20
          readOnly: true
          description: "เลขที่เอกสาร สร้างจาก seq_booking_code เช่น BK68000001 (ห้ามซ้ำ)"
          example: "BK68000001"
        cust_id:
          type: integer
          format: int64
          readOnly: true
          example: 7
        cust_name:
          type: string
          nullable: true
          readOnly: true
          description: "รวมมาให้แสดงผล (join employee) - ใช้แสดงในหน้ารายชื่อคนขับ"
          example: "มานี รักดี"
        sched_id:
          type: integer
          format: int64
          example: 1
        board_stop_id:
          type: integer
          format: int64
          example: 1
        board_stop_name:
          type: string
          nullable: true
          example: "มหาวิทยาลัยเทคโนโลยีมหานคร"
        alight_stop_id:
          type: integer
          format: int64
          example: 4
        alight_stop_name:
          type: string
          nullable: true
          example: "หอพักนักศึกษา"
        seats:
          type: integer
          minimum: 1
          maximum: 4
          example: 2
        status:
          type: string
          enum: ["reserved", "checked_in", "completed", "cancelled", "no_show"]
          example: "reserved"
        book_time:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-01T03:00:00.000Z"
        cancel_time:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: "null = ยังไม่ยกเลิก"
          example: null
        schedule:
          type: object
          nullable: true
          readOnly: true
          description: "ข้อมูลรอบที่จอง ใช้แสดงในหน้า My Booking (UC-19)"
          properties:
            service_date:
              type: string
              format: date
              example: "2026-10-02"
            depart_at:
              type: string
              format: date-time
              example: "2026-10-02T09:30:00.000Z"
            route_name:
              type: string
              nullable: true
              example: "เส้นทาง 2"
            plate_no:
              type: string
              nullable: true
              example: "สย 2591"
            driver_name:
              type: string
              nullable: true
              example: "ประเสริฐ ขับรถ"
      example:
        booking_id: 1
        booking_code: "BK68000001"
        cust_id: 7
        cust_name: "มานี รักดี"
        sched_id: 1
        board_stop_id: 1
        board_stop_name: "มหาวิทยาลัยเทคโนโลยีมหานคร"
        alight_stop_id: 4
        alight_stop_name: "หอพักนักศึกษา"
        seats: 2
        status: "reserved"
        book_time: "2026-10-01T03:00:00.000Z"
        cancel_time: null
        schedule:
          service_date: "2026-10-02"
          depart_at: "2026-10-02T09:30:00.000Z"
          route_name: "เส้นทาง 2"
          plate_no: "สย 2591"
          driver_name: "ประเสริฐ ขับรถ"

    BookingQr:
      type: object
      description: "QR Code สำหรับเช็คอิน (UC-20) - ASM-07-3: ใช้ได้ 1 ครั้งต่อ 1 การจอง"
      required: ["booking_id", "booking_code", "qr_token", "qr_image"]
      properties:
        booking_id:
          type: integer
          format: int64
          example: 1
        booking_code:
          type: string
          example: "BK68000001"
        qr_token:
          type: string
          description: "token ที่ฝังใน QR - ต้องเดาไม่ได้และเปลี่ยนได้ (unIQUE uq_booking_qr)"
          example: "b7f3c1a9d24e4f8ba1c6e0d5f9a2b31"
        qr_image:
          type: string
          format: byte
          description: "ภาพ QR แบบ base64 สร้างจาก qrcode ฝั่ง server (client ต้องเติม prefix `data:image/png;base64,` เอง)"
          example: "iVBORw0KGgoAAAANSUhEUg=="
        status:
          type: string
          description: "ถ้าเป็น cancelled จะไม่คืน QR (UC-20 A2) / ถ้า checked_in จะแจ้งว่าเช็คอินแล้ว"
          example: "reserved"
        seats:
          type: integer
          example: 2
        board_stop_name:
          type: string
          nullable: true
          example: "มหาวิทยาลัยเทคโนโลยีมหานคร"
        alight_stop_name:
          type: string
          nullable: true
          example: "หอพักนักศึกษา"
        depart_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-02T09:30:00.000Z"
      example:
        booking_id: 1
        booking_code: "BK68000001"
        qr_token: "b7f3c1a9d24e4f8ba1c6e0d5f9a2b31"
        qr_image: "iVBORw0KGgoAAAANSUhEUg=="
        status: "reserved"
        seats: 2
        board_stop_name: "มหาวิทยาลัยเทคโนโลยีมหานคร"
        alight_stop_name: "หอพักนักศึกษา"
        depart_at: "2026-10-02T09:30:00.000Z"

    # ---------- UC-22 ... UC-26 : Driver ----------

    DriverSchedule:
