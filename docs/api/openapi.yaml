        perm_name:
          type: string
          maxLength: 120
          example: "แก้ไขเส้นทาง"
        module:
          type: string
          maxLength: 50
          enum: ["master", "front", "booking", "driver", "report"]
          example: "front"
        screen_key:
          type: string
          maxLength: 80
          nullable: true
