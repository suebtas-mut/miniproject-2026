      description: |
        **Business Rule (M2 - สำคัญที่สุดของระบบ)**
        1) สิทธิ์อ่านจากฐานข้อมูลทุกครั้งที่ middleware ตรวจ ไม่ใช่ cache ใน token
        2) ⛔ ห้ามมี `if (role === 'admin')` ในโค้ด
        3) เมื่อถอดสิทธิ์แล้ว ผู้ใช้ที่ Login ใหม่จะเห็นเมนูหายทันที
           โดยไม่ต้องแก้โค้ด Dart และไม่ต้อง build แอปใหม่

        **Transaction (P-04 ข้อ 4)** - `MERGE` สิทธิ์ใหม่ + `DELETE` สิทธิ์ที่ถอดออก
        ใน Transaction เดียว ถ้าสิทธิ์ใดผิดจะ ROLLBACK ทั้งชุด ไม่ให้ตารางติ๊กอยู่ครึ่ง ๆ กลาง ๆ
