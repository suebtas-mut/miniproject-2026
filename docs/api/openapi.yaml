          type: integer
          format: int64
          description: "รอบที่กำลังเดิน - server ต้องเทียบ booking.sched_id กับ trip.sched_id ของ trip_id นี้"
          example: 1
        qr_token:
          type: string
          description: "ค่าที่อ่านได้จาก QR (client ต้อง debounce 2 วินาที กันอ่านซ้ำ)"
          example: "b7f3c1a9d24e4f8ba1c6e0d5f9a2b31"
        checkin_stop_id:
          type: integer
          format: int64
          nullable: true
          description: "จุดจอดที่ขึ้นจริง - ถ้าไม่ส่ง server จะใช้จุดขึ้นที่จองไว้"
          example: 1
      example:
        trip_id: 1
        qr_token: "b7f3c1a9d24e4f8ba1c6e0d5f9a2b31"
        checkin_stop_id: 1

    ScanResult:
      type: object
      description: "ผลการสแกน (UC-25 4a-4d)"
      required: ["result", "message"]
      properties:
        result:
          type: string
          enum: ["checked_in", "wrong_trip", "cancelled", "already_checked_in", "not_found"]
          example: "checked_in"
        message:
          type: string
          example: "เช็คอินสำเร็จ"
        booking_id:
          type: integer
          format: int64
          nullable: true
          example: 1
        booking_code:
          type: string
          nullable: true
          example: "BK68000001"
        passenger_name:
          type: string
          nullable: true
          example: "มานี รักดี"
        seats:
          type: integer
          nullable: true
          example: 2
        checkin_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-02T02:31:00.000Z"
        board_seq:
          type: integer
          nullable: true
          description: "จุดจอดที่ขึ้นจริง - ใช้ทำรายงาน R1/R5"
          example: 1
      example:
        result: "checked_in"
        message: "เช็คอินสำเร็จ"
        booking_id: 1
        booking_code: "BK68000001"
        passenger_name: "มานี รักดี"
        seats: 2
        checkin_time: "2026-10-02T02:31:00.000Z"
        board_seq: 1

    TripSummary:
      type: object
      description: "สรุปเมื่อปิดรอบ (UC-26 / BR-10)"
      required: ["trip_id", "status", "total_booked", "boarded", "alighted", "no_show_count"]
      properties:
        trip_id:
          type: integer
          format: int64
          example: 1
        sched_id:
          type: integer
          format: int64
          example: 1
        status:
          type: string
          enum: ["running", "completed"]
          example: "completed"
        start_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-02T02:30:00.000Z"
        end_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-02T03:00:00.000Z"
        total_booked:
          type: integer
          description: "จำนวนผู้โดยสารทั้งหมดในรอบ (นับ booking ที่ยังไม่ cancelled)"
          example: 3
        boarded:
          type: integer
          description: "ขึ้นจริง (trip_passenger.checkin_time IS NOT NULL)"
          example: 2
        alighted:
          type: integer
          description: "ลงจริง (trip_passenger.alight_time IS NOT NULL)"
          example: 2
        no_show_count:
          type: integer
          description: "BR-10 - booking ที่ยัง reserved ถูกเปลี่ยนเป็น no_show"
          example: 1
        no_show_names:
          type: array
          description: "รายชื่อคนที่ไม่มาใช้บริการ"
          items:
            type: string
          example: ["สมชาย ใจดี"]
        seats_booked:
          type: integer
          example: 5
        capacity:
          type: integer
          example: 9
      example:
        trip_id: 1
        sched_id: 1
        status: "completed"
        start_time: "2026-10-02T02:30:00.000Z"
        end_time: "2026-10-02T03:00:00.000Z"
        total_booked: 3
        boarded: 2
        alighted: 2
        no_show_count: 1
        no_show_names: ["สมชาย ใจดี"]
        seats_booked: 5
        capacity: 9

    # ---------- UC-27 / UC-28 / UC-29 : Report (R1 + R4 + R6) ----------

    ReportBoardingAlightingWeek:
      type: object
      description: |
        **R1 (UC-27)** เปรียบเทียบจำนวนคนขึ้น/ลงรายสัปดาห์

        เทคนิค Oracle: `TRUNC(service_date,'IW')` + `TO_CHAR(service_date,'IW')`
        ⛔ ห้าม `COUNT(DISTINCT alight_time)` เพราะนับ "จำนวนเวลาที่ไม่ซ้ำ" ไม่ใช่ "จำนวนคน"
        ต้องนับด้วย `COUNT(DISTINCT CASE WHEN tp.checkin_time IS NOT NULL THEN tp.booking_id END)`
      required: ["year", "total_weeks", "rows", "chart"]
      properties:
        year:
          type: integer
          example: 2568
        total_weeks:
          type: integer
          description: "จำนวนสัปดาห์ที่มีข้อมูล"
          example: 2
        rows:
          type: array
          items:
            type: object
            required: ["week_no", "board_count", "alight_count"]
            properties:
              week_no:
                type: integer
                description: "เลขสัปดาห์แบบ ISO (IW)"
                example: 1
              week_start:
                type: string
                format: date
                nullable: true
                example: "2026-01-05"
              board_count:
                type: integer
                description: "จำนวนคนขึ้นรถ"
                example: 12
              alight_count:
                type: integer
                description: "จำนวนคนลงรถ"
                example: 11
        chart:
          type: object
          description: "ข้อมูลสำหรับวาดกราฟ (UC-30 ข้อ 1: ทุกรายงานมีทั้งตารางและกราฟ)"
          required: ["labels", "datasets"]
          properties:
            type:
              type: string
              enum: ["bar_grouped", "line"]
              example: "bar_grouped"
            labels:
              type: array
              items:
                type: string
              example: ["สัปดาห์ 1", "สัปดาห์ 2"]
            datasets:
              type: array
              items:
                type: object
                required: ["label", "data"]
                properties:
                  label:
                    type: string
                    example: "จำนวนคนขึ้น"
                  data:
                    type: array
                    items:
                      type: integer
                    example: [12, 15]
      example:
        year: 2568
        total_weeks: 2
        rows:
          - week_no: 1
            week_start: "2026-01-05"
            board_count: 12
            alight_count: 11
          - week_no: 2
            week_start: "2026-01-12"
            board_count: 15
            alight_count: 15
        chart:
          type: "bar_grouped"
          labels: ["สัปดาห์ 1", "สัปดาห์ 2"]
          datasets:
            - label: "จำนวนคนขึ้น"
              data: [12, 15]
            - label: "จำนวนคนลง"
              data: [11, 15]

    ReportDailyByRoute:
      type: object
      description: |
        **R4 (UC-28)** สรุปยอดผู้ใช้รายวันรายเส้นทาง

        เทคนิค Oracle: `PIVOT` สร้างคอลัมน์เส้นทาง 1-3 +
        `SUM(...) OVER (PARTITION BY service_date)` หรือ `GROUPING SETS` ได้คอลัมน์ "รวมทั้งวัน"
        ต้อง `GROUP BY s.service_date` (วันเต็ม) ไม่ใช่ชื่อวัน
        จึงรวมวันจันทร์ทุกสัปดาห์ในช่วงที่เลือกเป็นแถวเดียวโดยอัตโนมัติ
      required: ["from", "to", "route_ids", "rows", "chart"]
      properties:
        from:
          type: string
          format: date
          example: "2026-10-01"
        to:
          type: string
          format: date
          example: "2026-10-31"
        route_ids:
          type: array
          description: "รหัสเส้นทางที่รวมอยู่ในรายงาน (จาก route ที่ is_active = 1)"
          items:
            type: integer
            format: int64
          example: [2, 3]
        rows:
          type: array
          items:
            type: object
            required: ["service_date", "day_name", "total"]
            properties:
              service_date:
                type: string
                format: date
                example: "2026-10-05"
              day_name:
                type: string
                description: "ชื่อวันย่อ จ/อ/พ/พฤ/ศ/ส/อา"
                example: "จ"
              route_counts:
                type: object
                description: "จำนวนผู้ใช้แยกตามเส้นทาง - key คือ route_id"
                additionalProperties:
                  type: integer
                example: { "2": 7, "3": 4 }
              total:
                type: integer
                description: "คอลัมน์รวมทั้งวัน (ผลรวมของทุกเส้นทางในวันนั้น)"
                example: 11
        chart:
          type: object
          required: ["type", "labels", "datasets"]
          properties:
            type:
              type: string
              enum: ["stacked_bar", "bar_grouped"]
              example: "stacked_bar"
            labels:
              type: array
              items:
                type: string
              example: ["2026-10-01", "2026-10-05"]
            datasets:
              type: array
              items:
                type: object
                required: ["label", "data"]
                properties:
                  label:
                    type: string
                    example: "เส้นทาง 2"
                  data:
                    type: array
                    items:
                      type: integer
                    example: [7, 7]
      example:
        from: "2026-10-01"
        to: "2026-10-31"
        route_ids: [2, 3]
        rows:
          - service_date: "2026-10-05"
            day_name: "จ"
            route_counts: { "2": 7, "3": 4 }
            total: 11
        chart:
          type: "stacked_bar"
          labels: ["2026-10-05"]
          datasets:
            - label: "เส้นทาง 2"
              data: [7]
            - label: "เส้นทาง 3"
              data: [4]

    ReportDriverWorkload:
      type: object
      description: |
        **R6 (UC-29)** สรุปการมอบหมายงานคนขับ

        เทคนิค Oracle: `Analytic` + `ROLLUP` เพื่อได้แถว "รวมทั้งหมด"
        (แถวรวมจะมี `driver_id = null`) + `CASE WHEN TO_CHAR(depart_at,'HH24') < 17`
      required: ["from", "to", "rows", "chart"]
      properties:
        from:
          type: string
          format: date
          example: "2026-10-01"
        to:
          type: string
          format: date
          example: "2026-10-31"
        rows:
          type: array
          items:
            type: object
            required: ["total_trips", "before_17", "after_17"]
            properties:
              driver_id:
                type: integer
                format: int64
                nullable: true
                description: "null = แถวรวมทั้งหมดจาก ROLLUP"
                example: 5
              driver_name:
                type: string
                nullable: true
                example: "ประเสริฐ ขับรถ"
              total_trips:
                type: integer
                description: "รวมรอบทั้งหมด"
                example: 8
              before_17:
                type: integer
                description: "รอบที่ depart_at ก่อน 17:00"
                example: 5
              after_17:
                type: integer
                description: "รอบที่ depart_at ตั้งแต่ 17:00 เป็นต้นไป"
                example: 3
        chart:
          type: object
          required: ["type", "labels", "datasets"]
          properties:
            type:
              type: string
              enum: ["bar_grouped", "pie"]
              example: "bar_grouped"
            labels:
              type: array
              items:
                type: string
              example: ["ประเสริฐ ขับรถ"]
            datasets:
              type: array
              items:
                type: object
                required: ["label", "data"]
                properties:
                  label:
                    type: string
                    example: "ก่อน 17:00"
                  data:
                    type: array
                    items:
                      type: integer
                    example: [5]
      example:
        from: "2026-10-01"
        to: "2026-10-31"
        rows:
          - driver_id: 5
            driver_name: "ประเสริฐ ขับรถ"
            total_trips: 8
            before_17: 5
            after_17: 3
          - driver_id: null
            driver_name: null
            total_trips: 8
            before_17: 5
            after_17: 3
        chart:
          type: "bar_grouped"
          labels: ["ประเสริฐ ขับรถ"]
          datasets:
            - label: "ก่อน 17:00"
              data: [5]
            - label: "หลัง 17:00"
              data: [3]

paths:

  # ==================================================================
  # AUTH  —  UC-01 / UC-02 / UC-03   (M3)
  # ==================================================================

  /auth/login:
    post:
      tags: ["Auth"]
      operationId: "login"
      summary: "UC-01 เข้าสู่ระบบ"
      description: |
        คืน JWT + `permissions` + `menus` ทั้งหมดเพื่อให้แอปสร้าง Dynamic Menu

        **Business Rule**
        - R-03: สิทธิ์อ่านจาก `role_permission` ทุกครั้ง ห้าม hardcode
        - R-04: `bcrypt.compare` กับ `password_hash`
        - R-02: ค้น `employee` ด้วย bind variable `:username` (ห้ามต่อสตริง)
        - ไม่บอกว่าอะไรผิด - ถ้าไม่พบผู้ใช้หรือรหัสผ่านไม่ผ่าน ตอบข้อความเดียวกัน
        - ASM-07-1 ไม่เกี่ยวกับ endpoint นี้
      x-use-case: "UC-01"
      x-business-rules: ["R-02", "R-03", "R-04"]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: "admin"
              password: "<รหัสผ่านของคุณ>"
      responses:
        "200":
          description: "เข้าสู่ระบบสำเร็จ"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    example: "เข้าสู่ระบบสำเร็จ"
                  data:
                    $ref: "#/components/schemas/LoginResponse"
              example:
                success: true
                message: "เข้าสู่ระบบสำเร็จ"
                data:
                  access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIxMiJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                  token_type: "Bearer"
                  expires_in: 7200
                  employee:
                    emp_id: 1
                    emp_code: "EMP001"
                    first_name: "ระบบ"
                    last_name: "ผู้ดูแลระบบ"
                    username: "admin"
                    is_active: 1
                    roles: ["ADMIN"]
                  permissions: ["EMPLOYEE.VIEW", "EMPLOYEE.EDIT", "ROUTE.EDIT"]
                  menus:
                    - screen_key: "employee"
                      label: "พนักงาน"
                      sort_no: 10
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "401 Unauthorized - ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง / บัญชีถูกปิดใช้งาน (A1)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "INVALID_CREDENTIALS"
                  message: "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags: ["Auth"]
      operationId: "logout"
      summary: "UC-02 ออกจากระบบ"
      description: |
        เพิ่ม `jti` ของ token ลง `token_blacklist` พร้อม `expires_at`
        เพื่อให้ token ใช้ต่อไม่ได้แม้ยังไม่หมดอายุ (UC-02 Business Rule)

        ใช้ `MERGE` กันซ้ำเมื่อมีแถวเดิมอยู่แล้ว (UC-02 Alternative 2a)
      x-use-case: "UC-02"
      x-transaction: "1 statement (MERGE) - ไม่ต้องเปิด Transaction แยก"
      responses:
        "200":
          description: "ออกจากระบบสำเร็จ"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    example: "ออกจากระบบสำเร็จ"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      tags: ["Auth"]
      operationId: "getCurrentUser"
      summary: "UC-01 ข้อมูลผู้ใช้ปัจจุบัน + สิทธิ์ทั้งหมด"
      description: |
        ใช้หลัง Login และหลังกลับจาก background เพื่อเช็คว่า token ยังไม่ถูก revoke
        แอปเทียบ `permissions` ที่ได้กับ token เดิม ถ้าต่างกันให้รีเฟรชเมนู
      x-use-case: "UC-01"
      responses:
        "200":
          description: "ข้อมูลผู้ใช้ปัจจุบัน"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      employee:
                        $ref: "#/components/schemas/EmployeeProfile"
                      permissions:
                        type: array
                        items:
                          type: string
                        example: ["EMPLOYEE.VIEW", "EMPLOYEE.EDIT"]
                      menus:
                        type: array
                        items:
                          $ref: "#/components/schemas/MenuItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/change-password:
    post:
      tags: ["Auth"]
      operationId: "changePassword"
      summary: "UC-03 เปลี่ยนรหัสผ่าน"
      description: |
        **Business Rule (R-04)**
        - ตรวจความยาวขั้นต่ำ 8 ตัวอักษร
        - `new_password` ต้องตรงกับ `confirm_password`
        - server ทำ `bcrypt.hash` — ⛔ ห้ามเก็บ plaintext
        - หลังเปลี่ยนสำเร็จ ต้อง revoke token เดิมทั้งหมด (บังคับ Login ใหม่)
      x-use-case: "UC-03"
      x-business-rules: ["R-04"]
      x-transaction: "UPDATE password_hash + DELETE token_blacklist ของ emp_id เดียวกัน"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            example:
              old_password: "<รหัสผ่านเดิม>"
              new_password: "<รหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร>"
              confirm_password: "<รหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร>"
      responses:
        "200":
          description: "เปลี่ยนรหัสผ่านสำเร็จ - ต้อง Login ใหม่"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    example: "เปลี่ยนรหัสผ่านสำเร็จ กรุณาเข้าสู่ระบบใหม่"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "401 Unauthorized - token หมดอายุ หรือรหัสผ่านเดิมไม่ถูกต้อง"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "INVALID_CREDENTIALS"
                  message: "รหัสผ่านเดิมไม่ถูกต้อง"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==================================================================
  # MASTER  —  UC-05 / UC-06 / UC-04   (M1)
  # ==================================================================

  /departments:
    get:
      tags: ["Master"]
      operationId: "listDepartments"
      summary: "UC-05 ดูรายการแผนก"
      description: |
        ใช้ `ORDER BY dept_id` เสมอ กันลำดับไม่นิ่งเวลาแบ่งหน้า (P-04 ข้อ 3)
        ไม่มี `SELECT *` - ระบุเฉพาะ `dept_id, dept_name, created_at`
      x-use-case: "UC-05"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: "q"
          in: query
          required: false
          description: "ค้นหาจาก `dept_name` (ใช้ LIKE กับ bind variable)"
          schema:
            type: string
            example: "บริหาร"
      responses:
        "200":
          description: "รายการแผนก"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Department"
                  meta:
