    get:
      tags: ["Front"]
      operationId: "getRouteStops"
      summary: "UC-12.2 / UC-12.4 จุดจอดในเส้นทาง + นาที + เวลารวม"
      description: |
        คืนจุดจอดเรียงตาม `stop_seq` พร้อม `travel_minutes` และ `route.total_minutes` (BR-01)
        ใช้แสดงข้อความ "เวลารวมทั้งเส้นทาง: XX นาที" (UC-12 ขั้นที่ 6)
      x-use-case: "UC-12"
      x-business-rules: ["BR-01", "BR-03"]
      responses:
        "200":
          description: "รายละเอียดจุดจอดของเส้นทาง"
