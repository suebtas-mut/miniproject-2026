                    properties:
                      route_id:
                        type: integer
                        format: int64
                        example: 2
                      route_name:
                        type: string
                        example: "เส้นทาง 2"
                      total_minutes:
                        type: integer
                        description: "BR-01 = SUM(travel_minutes)"
                        example: 13
                      stops:
                        type: array
                        items:
                          $ref: "#/components/schemas/RouteStop"
              example:
                success: true
                data:
                  route_id: 2
                  route_name: "เส้นทาง 2"
                  total_minutes: 13
                  stops:
                    - route_id: 2
                      stop_id: 1
                      stop_seq: 1
                      travel_minutes: 0
                      stop_name: "มหาวิทยาลัยเทคโนโลยีมหานคร"
                    - route_id: 2
                      stop_id: 4
                      stop_seq: 2
                      travel_minutes: 5
                      stop_name: "หอพักนักศึกษา"
                    - route_id: 2
                      stop_id: 5
                      stop_seq: 3
                      travel_minutes: 4
                      stop_name: "หออาคารพักนักศึกษา"
                    - route_id: 2
                      stop_id: 6
                      stop_seq: 4
                      travel_minutes: 4
                      stop_name: "สวนหลวง"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: ["Front"]
      operationId: "saveRouteStops"
      summary: "UC-12.2 เรียงจุดจอด + นาที แล้วคำนวณเวลารวมใหม่"
      description: |
        **Business Rule (F1)**
        - BR-01: `route.total_minutes` = `SUM(route_stop.travel_minutes)` คำนวณใหม่ทุกครั้งที่แก้
        - BR-03: จุดจอดซ้ำในเส้นทางเดียวกันไม่ได้ (UNIQUE `(route_id, stop_id)`) → ตอบ 409 (UC-12 2b)
        - `stop_seq` ต้องเรียง 1..n ต่อเนื่อง และห้ามซ้ำ → ตอบ 400 (UC-12 2a)
        - ต้องเรียงเป็น Stepper Form แทนฟอร์มยาว 1 หน้า (17.0.1)

        **Transaction (P-04 ข้อ 4)** - DELETE `route_stop` เดิม → INSERT ใหม่ทั้งรายการ
        → UPDATE `route.total_minutes` ทั้งหมดใน Transaction เดียว
        ถ้าจุดใดผิดจะ ROLLBACK เส้นทางยังเป็นชุดเดิม ไม่เหลือเป็นจุดจอดครึ่งเส้นทาง
      x-use-case: "UC-12"
      x-business-rules: ["BR-01", "BR-03"]
      x-transaction: "DELETE route_stop + INSERT route_stop + UPDATE route.total_minutes"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteStopListRequest"
            example:
              stops:
                - stop_id: 1
                  stop_seq: 1
                  travel_minutes: 0
                - stop_id: 4
                  stop_seq: 2
                  travel_minutes: 5
                - stop_id: 5
                  stop_seq: 3
                  travel_minutes: 4
                - stop_id: 6
                  stop_seq: 4
                  travel_minutes: 4
      responses:
        "200":
          description: "บันทึกจุดจอดสำเร็จ พร้อมเวลารวมที่คำนวณใหม่"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
