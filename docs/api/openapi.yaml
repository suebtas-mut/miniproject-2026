  /driver/trip/{schedId}/start:
    parameters:
      - $ref: "#/components/parameters/SchedIdParam"
    post:
      tags: ["Driver"]
      operationId: "startTrip"
      summary: "UC-23 เริ่มงาน (กด Start)"
      description: |
        **Business Rule (D2)**
        - งานค้าง → ต้องปิดงานเดิมก่อน (UC-23 3b) → 409
        - รอบนี้เริ่มไปแล้ว → 409 (UC-23 3c) ป้องกันเริ่มซ้ำ
        - 1 รอบ = 1 trip และ 1 คนขับ = 1 รอบเวลา (BR-04)

        **Transaction (P-04 ข้อ 4)** — ลำดับสำคัญ
        1. `SELECT ... FROM schedule WHERE sched_id = :schedId FOR UPDATE`
        2. ตรวจว่ารอบนี้เป็นของคนขับที่ Login และยังไม่มี `trip`
        3. ตรวจว่าไม่มี `trip` ของคนขับคนนี้ที่ยัง `status='running'`
        4. INSERT `trip (sched_id, driver_id, veh_id, start_time, status)` → COMMIT

        ⛔ ห้าม `FOR UPDATE` กับ aggregate (UC-18 / UC-23) เพราะจะได้ ORA-02014
