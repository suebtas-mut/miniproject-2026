    # ---------- UC-12 : Route / Route Stop ----------

    Route:
      type: object
      description: "ตาราง `route` - `total_minutes` เป็น readOnly เพราะ BR-01 ให้ service คำนวณ"
      required: ["route_id", "route_name", "total_minutes", "is_active"]
      properties:
        route_id:
          type: integer
          format: int64
          readOnly: true
          example: 2
        route_name:
          type: string
          maxLength: 120
          example: "เส้นทาง 2"
        total_minutes:
          type: integer
          readOnly: true
          description: "BR-01 = SUM(route_stop.travel_minutes) - ผู้ใช้ห้ามพิมพ์เอง"
          example: 13
        stop_count:
          type: integer
          readOnly: true
          description: "จำนวนจุดจอดในเส้นทาง (นับจาก route_stop)"
          example: 4
        description:
          type: string
          maxLength: 255
          nullable: true
          example: "เส้นทางรอบวิทยาเขต"
        is_active:
          type: integer
          format: int32
          enum: [0, 1]
          example: 1
      example:
        route_id: 2
        route_name: "เส้นทาง 2"
        total_minutes: 13
        stop_count: 4
        description: "เส้นทางรอบวิทยาเขต"
        is_active: 1

    RouteRequest:
      type: object
      required: ["route_name"]
      properties:
        route_name:
          type: string
          maxLength: 120
          example: "เส้นทาง 2"
        description:
          type: string
          maxLength: 255
          nullable: true
          example: "เส้นทางรอบวิทยาเขต"
        is_active:
          type: integer
          format: int32
          enum: [0, 1]
          default: 1
          example: 1
      example:
        route_name: "เส้นทาง 2"
        description: "เส้นทางรอบวิทยาเขต"
        is_active: 1

    RouteStop:
      type: object
      description: "ตาราง `route_stop` - PK = (route_id, stop_seq) และ UNIQUE (route_id, stop_id) ตาม BR-03"
      required: ["route_id", "stop_id", "stop_seq", "travel_minutes"]
      properties:
        route_id:
          type: integer
          format: int64
          example: 2
        stop_id:
          type: integer
          format: int64
          example: 4
        stop_seq:
          type: integer
          minimum: 1
          description: "ลำดับ 1..n ห้ามซ้ำในเส้นทางเดียวกัน (pk_route_stop)"
          example: 2
        travel_minutes:
          type: integer
          minimum: 0
          description: "นาทีจากจุดก่อนหน้าถึงจุดนี้ (ck_rs_min ห้ามติดลบ)"
          example: 5
        stop_name:
          type: string
          nullable: true
          readOnly: true
          description: "รวมมาให้แสดงผล (join stop)"
          example: "หอพักนักศึกษา"
      example:
        route_id: 2
        stop_id: 4
        stop_seq: 2
        travel_minutes: 5
        stop_name: "หอพักนักศึกษา"

    RouteStopListRequest:
      type: object
      description: |
        เรียงจุดจอดของทั้งเส้นทาง (UC-12.2)
        ส่งเป็นรายการเต็ม ไม่ใช่ patch - server ลบ `route_stop` เดิมทั้งหมดแล้ว INSERT ใหม่ใน Transaction เดียว
        แล้วคำนวณ `route.total_minutes` ใหม่ตาม BR-01
      required: ["stops"]
      properties:
        stops:
          type: array
          minItems: 1
          description: "ต้องเรียง `stop_seq` 1..n ต่อเนื่อง"
          items:
            type: object
            required: ["stop_id", "stop_seq", "travel_minutes"]
            properties:
              stop_id:
                type: integer
                format: int64
                example: 4
              stop_seq:
                type: integer
                minimum: 1
                example: 2
              travel_minutes:
                type: integer
                minimum: 0
                example: 5
      example:
        stops:
          - stop_id: 1
            stop_seq: 1
            travel_minutes: 0
          - stop_id: 4
            stop_seq: 2
            travel_minutes: 5
          - stop_id: 5
            stop_seq: 3
            travel_minutes: 4
          - stop_id: 6
            stop_seq: 4
            travel_minutes: 4

