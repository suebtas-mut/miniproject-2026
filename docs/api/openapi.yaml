          type: string
          format: date-time
          example: "2026-10-02T09:30:00.000Z"
        end_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-02T09:43:00.000Z"
        route_id:
          type: integer
          format: int64
          example: 2
        route_name:
          type: string
          nullable: true
