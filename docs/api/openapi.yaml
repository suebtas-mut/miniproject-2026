  /report/boarding-alighting-week:
    get:
      tags: ["Report"]
      operationId: "reportBoardingAlightingWeek"
      summary: "UC-27 / R1 สถิติคนขึ้น-ลง รายสัปดาห์ (ทำจริง)"
      description: |
        **R1 ✅** - จำนวนผู้โดยสารที่ขึ้นรถและลงรถ รายสัปดาห์ ตามเงื่อนไข PDF

        ⛔ **กับดักที่ต้องระวัง (UC-27)**
        `COUNT(DISTINCT alight_time)` **ผิด** เพราะลงในคันเดียวกันเวลาเดียวกันได้
        ต้องนับจาก `trip_passenger` 1 แถว = 1 คนต่อ 1 การเดินทาง
        (`COUNT(tp.booking_id)`) และนับสถานะ `no_show` แยกออกจากคนที่ขึ้นจริง

        นิยามที่ใช้
        - ขึ้นรถ = `trip_passenger.checkin_time IS NOT NULL`
        - ลงรถ = `trip_passenger.alight_time IS NOT NULL`
        - พลาดรถ = `booking.status = 'no_show'` (BR-10)
        - 1 สัปดาห์ = วันจันทร์–วันอาทิตย์ (พ.ศ. 2568) เริ่มที่ `service_date`
        - `route_id` 2 และ 3 (เส้นทาง 1 ถูกข้ามตามข้อมูลจริง)
      x-use-case: ["UC-27", "UC-30"]
      x-report: "R1"
      x-pdf-condition: "1 จาก {1,2} — คนขึ้น/ลง"
      x-business-rules: ["BR-10"]
      parameters:
