  # ==================================================================
  # RBAC  —  UC-07 / UC-08 / UC-09   (M2)
  # ==================================================================

  /roles:
    get:
      tags: ["RBAC"]
      operationId: "listRoles"
      summary: "UC-07 ดูรายการบทบาท (พร้อมสิทธิ์ที่ได้รับ)"
      description: |
        ⛔ ไม่ hardcode รายชื่อบทบาท - อ่านจาก `app_role` ทุกครั้ง (UC-07 Business Rule)
        ตารางจริงชื่อ `app_role` เพราะ `ROLE` เป็นคำสงวนของ Oracle

        **ทำไมต้องมี `granted_perm_ids` ติดมาด้วย**
        17.5.2 ให้ `PUT /permission-matrix` บันทึก แต่ไม่มี GET แยกมาให้
        หน้าจอ UC-09 (ตารางติ๊กแนวนอน) จึงต้องอ่านสิทธิ์ที่ติ๊กอยู่ก่อน
        วิธีนี้คือใช้ `GET /roles` + `GET /permissions` ที่มีอยู่แล้ว ไม่ต้องเพิ่ม endpoint ใหม่
        - `granted_perm_ids` = `perm_id` ที่ Role นั้นมีใน `role_permission`
        - คูณกับ `GET /permissions` แล้วติ๊กที่ตรงกัน = เครื่องหมายถูกในตาราง

        สิทธิ์อ่านจากฐานข้อมูลทุกครั้ง ไม่ใช่ cache ใน token (UC-09 BR ข้อ 1)
      x-use-case: ["UC-07", "UC-09"]
      x-business-rules: ["BR-01"]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: "is_active"
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
            example: 1
      responses:
        "200":
          description: "รายการบทบาท"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/AppRole"
                        - type: object
                          properties:
                            granted_perm_ids:
                              type: array
                              description: "`perm_id` ที่บทบาทนี้ได้รับ (UC-09 ใช้วาดตารางติ๊ก)"
                              items:
                                type: integer
                                format: int64
                              example: [1, 2, 5, 12]
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                success: true
                data:
                  - role_id: 3
                    role_name: "DRIVER"
                    description: "ผู้ขับรถ"
                    is_active: 1
                    granted_perm_ids: [20, 21, 22]
                meta:
                  page: 1
                  limit: 20
                  total: 4
                  total_pages: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: ["RBAC"]
      operationId: "createRole"
      summary: "UC-07 เพิ่มบทบาท"
      description: "เพิ่มได้ตลอดเวลา ไม่ต้องแก้โค้ด (M2)"
      x-use-case: "UC-07"
      requestBody:
        required: true
        content:
