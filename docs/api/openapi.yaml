  /booking/{id}/qr:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: ["Booking"]
      operationId: "getBookingQr"
      summary: "UC-20 แสดง QR Code สำหรับเช็คอิน"
      description: |
        **Business Rule (B2)**
        1) จองสำเร็จต้อง generate QR Code — สร้างจาก `qr_token`
        2) ใช้สำหรับ check in ขึ้นรถ
        3) ASM-07-3: QR ใช้ได้ 1 ครั้งต่อ 1 การจอง
        4) `qr_token` ต้องเดาไม่ได้และเปลี่ยนได้

        **Alternative Flow**
        - 2a `status = cancelled` → ไม่แสดง QR (ตอบ 404 เพราะไม่มี QR ที่ใช้ได้)
        - 2b `status = checked_in` → คืน `status` ให้แอปแสดง "เช็คอินแล้ว" แทน QR ใหม่

        ต้องตรวจว่าเป็นการจองของผู้ใช้ที่ Login ไม่ใช่ของคนอื่น → 403
      x-use-case: "UC-20"
      responses:
        "200":
          description: "QR Code ของการจอง"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
