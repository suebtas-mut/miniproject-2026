  /schedules/{id}/assign-driver:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: ["Front"]
      operationId: "assignDriver"
      summary: "UC-15 มอบหมายคนขับให้รอบเวลา"
      description: |
        **BR-04 (สำคัญ)** — คนขับ 1 คน ห้ามถูกมอบหมาย 2 รอบที่เวลาทับกัน
        - นิยามชนกัน (ASM-07-1): ช่วงเวลา = `[depart_at, depart_at + route.total_minutes]`
        - ถ้าชนกันต้อง **ปฏิเสธ + แจ้งรอบที่ชน** ไม่ใช่แค่บล็อกเงียบ ๆ
        - ตรวจช่วงเวลาทับกันของ `driver_assign` ก่อนเสมอ โดยเทียบ `emp_id` เดียวกัน
        - พนักงานต้องมี Role = DRIVER อยู่จริง ไม่ใช่ก็ตอบ 422

        **Transaction (P-04 ข้อ 4)** - `SELECT ... FROM schedule WHERE sched_id = :id FOR UPDATE`
        → ตรวจชนกัน → INSERT `driver_assign` → COMMIT
        ล็อกแถว `schedule` ก่อน เพราะห้ามใช้ `FOR UPDATE` กับ aggregate (UC-18 ข้อ Oracle: ORA-02014)
        แล้วเขียน Audit Log ใน Transaction เดียวกัน
