          type: string
          maxLength: 50
          enum: ["master", "front", "booking", "driver", "report"]
          example: "front"
        screen_key:
          type: string
          maxLength: 80
          nullable: true
          description: "รหัสหน้าจอ ใช้สร้าง Dynamic Menu - ถ้าว่าง endpoint นี้จะไม่โผล่ในเมนู"
          example: "route"
        sort_no:
          type: integer
          default: 0
          description: "ลำดับเมนู (เลขน้อยก่อน)"
          example: 20
