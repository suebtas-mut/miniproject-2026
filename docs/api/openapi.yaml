  /report/driver-workload:
    get:
      tags: ["Report"]
      operationId: "reportDriverWorkload"
      summary: "UC-29 / R6 รอบงานคนขับ แยกก่อน/หลัง 17:00 (ทำจริง)"
      description: |
        **R6 ✅** - จำนวนรอบงานของคนขับ แยกเป็น "ก่อน 17:00" และ "หลัง 17:00" ตาม PDF

        **เงื่อนไข PDF ที่ต้องทำตาม**
        - นับรอบงาน = `COUNT(driver_assign)` ที่ผูกกับคนขับแต่ละคน
        - แยกจุดตัดเวลา 17:00 ตาม `schedule.depart_at`
          ก่อน 17:00 = `depart_at < 17:00` ของวันนั้น, หลัง 17:00 = `depart_at >= 17:00`
        - คนขับที่ไม่มีรอบงานเลยในช่วงนั้น → 0 / 0
        - ต้องใช้ `ROLLUP` เพื่อได้ยอดรวมแถวสุดท้าย (UC-29)
        - `driver_name` ต้องมาจาก `employee` เสมอ ไม่ hardcode และไม่เป็น NULL

        ช่วงเวลาเป็น พ.ศ. 2568 (2568 = `SYSDATE` บวก 543 ปี — ต้องระวังเรื่องนี้ในการแปลงปี)
      x-use-case: ["UC-29", "UC-30"]
      x-report: "R6"
      x-pdf-condition: "1 จาก {6,7} — รอบงานคนขับ ก่อน/หลัง 17:00"
