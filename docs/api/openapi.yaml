  /driver/trip/scan:
    post:
      tags: ["Driver"]
      operationId: "scanQr"
      summary: "UC-25 สแกน QR เช็คอิน"
      description: |
        **BR-09 (หัวใจของ D3)** — สแกน QR ผิดรอบ → ไม่อนุญาตให้ขึ้นรถ
        ต้องเทียบ `booking.sched_id` กับ `trip.sched_id` ของ `trip_id` ที่ส่งมา

        **ผลลัพธ์ 4 กรณีตาม UC-25 4a-4d** (คืน 200 ทุกกรณี ให้แอปตัดสินใจแสดงผล)
        | `result` | ความหมาย |
        |---|---|
        | `checked_in` | 4a เช็คอินสำเร็จ |
        | `wrong_trip` | 4b **BR-09** ผิดรอบ - ไม่อนุญาตให้ขึ้นรถ |
        | `cancelled` | 4c การจองถูกยกเลิกแล้ว |
        | `already_checked_in` | 4d เช็คอินไปแล้ว (ASM-07-3 ใช้ QR ได้ครั้งเดียว) |
        | `not_found` | ไม่พบ `qr_token` นี้ในระบบ |

        **Transaction (P-04 ข้อ 4)**
        1. `SELECT ... FROM booking WHERE qr_token = :qrToken FOR UPDATE`
        2. ตรวจ BR-09 + สถานะ + เช็คอินซ้ำ
        3. `UPDATE booking SET status='checked_in'` +
           `INSERT trip_passenger (trip_id, booking_id, checkin_stop_id, checkin_time)`
        4. COMMIT

        ⛔ `qr_token` ต้องเป็น bind variable เสมอ ห้ามต่อลงใน SQL
        client ต้อง debounce 2 วินาทีกันอ่านซ้ำ (UC-25)
      x-use-case: "UC-25"
      x-business-rules: ["BR-09"]
      x-transaction: "SELECT booking FOR UPDATE + UPDATE booking + INSERT trip_passenger"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
            example:
              trip_id: 1
              qr_token: "b7f3c1a9d24e4f8ba1c6e0d5f9a2b31"
              checkin_stop_id: 1
      responses:
        "200":
          description: "ผลการสแกน (ดูตาราง `result` ด้านบน)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/ScanResult"
              examples:
                4a-success:
                  summary: "4a เช็คอินสำเร็จ"
                  value:
                    success: true
                    data:
                      result: "checked_in"
                      message: "เช็คอินสำเร็จ"
                      booking_id: 1
                      booking_code: "BK68000001"
                      passenger_name: "มานี รักดี"
                      seats: 2
                      checkin_time: "2026-10-02T02:31:00.000Z"
                      board_seq: 1
                4b-wrong-trip:
                  summary: "4b ผิดรอบ (BR-09) - ไม่อนุญาตให้ขึ้นรถ"
                  value:
                    success: true
                    data:
                      result: "wrong_trip"
                      message: "QR นี้ไม่ใช่ของรอบที่กำลังเดิน"
                      booking_code: "BK68000002"
                      passenger_name: "สมชาย ใจดี"
                4c-cancelled:
                  summary: "4c การจองถูกยกเลิกแล้ว"
                  value:
                    success: true
                    data:
                      result: "cancelled"
                      message: "การจองนี้ถูกยกเลิกแล้ว"
                      booking_code: "BK68000003"
                4d-already:
                  summary: "4d เช็คอินไปแล้ว (ASM-07-3)"
                  value:
                    success: true
                    data:
                      result: "already_checked_in"
                      message: "เช็คอินไปแล้ว"
                      booking_id: 1
                      booking_code: "BK68000001"
                      passenger_name: "มานี รักดี"
                      checkin_time: "2026-10-02T02:31:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "404 - ไม่พบ `qr_token` นี้ (`result = not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "QR_NOT_FOUND"
                  message: "ไม่พบ QR นี้ในระบบ"
        "500":
          $ref: "#/components/responses/InternalError"

  /driver/trip/{tripId}/complete:
    parameters:
      - $ref: "#/components/parameters/TripIdParam"
    post:
      tags: ["Driver"]
      operationId: "completeTrip"
      summary: "UC-26 ปิดงาน + สรุปยอด + mark no_show"
      description: |
        **BR-10** - ปิดรอบงานแล้ว การจองที่ยัง `reserved` ต้องกลายเป็น `no_show`

        **Transaction (P-04 ข้อ 4)** - ทำ 3 อย่างใน Transaction เดียว
        1. `SELECT ... FROM trip WHERE trip_id = :tripId FOR UPDATE`
        2. `UPDATE trip SET end_time = SYSTIMESTAMP, status = 'completed'`
        3. `UPDATE booking SET status = 'no_show' WHERE sched_id = :schedId AND status = 'reserved'`
        4. INSERT `audit log` → COMMIT

        ถ้าขั้นใดผิดจะ ROLLBACK ทั้งหมด จะได้ไม่มีรอบที่ปิดแล้วแต่ booking ยังค้าง `reserved`

        ต้องคืนยอดให้คนขับตรวจก่อนกดยืนยัน (UC-26 ขั้นที่ 5):
        `total_booked` / `boarded` / `alighted` / `no_show_count` + รายชื่อคนที่ไม่มา
        กดซ้ำไม่ได้ — ปิดแล้วถือว่าจบ (409)
      x-use-case: "UC-26"
      x-business-rules: ["BR-10"]
      x-transaction: "SELECT trip FOR UPDATE + UPDATE trip + UPDATE booking -> no_show + INSERT audit log"
      responses:
        "200":
          description: "ปิดงานสำเร็จ พร้อมสรุปยอดและรายชื่อ no_show (BR-10)"
          content:
            application/json:
              schema:
