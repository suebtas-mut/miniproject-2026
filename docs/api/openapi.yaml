  /schedules:
    get:
      tags: ["Front"]
      operationId: "listSchedules"
      summary: "UC-14 ตารางรอบเวลา (เชิงเส้นทาง x วัน)"
      description: |
        รายการรอบพร้อมคนขับ รถ และที่นั่งว่าง สำหรับหน้าปฏิทิน/ตารางในแอป
        ที่นั่งว่าง = `capacity - NVL(SUM(booking.seats),0)` เฉพาะ `status = 'reserved'` (BR-07)
      x-use-case: "UC-14"
      x-business-rules: ["BR-07"]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: "route_id"
          in: query
          required: false
          schema:
            type: integer
            format: int64
            example: 2
        - name: "from"
          in: query
          required: false
          description: "วันที่เริ่มต้น (รวม)"
          schema:
            type: string
            format: date
            example: "2026-10-01"
        - name: "to"
          in: query
          required: false
          description: "วันที่สิ้นสุด (รวม)"
          schema:
            type: string
            format: date
            example: "2026-10-31"
        - name: "is_active"
          in: query
          required: false
          description: "1 = เปิดจอง, 0 = ปิดรอบ"
          schema:
            type: integer
            enum: [0, 1]
            example: 1
      responses:
        "200":
          description: "รายการรอบเวลา"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: ["Front"]
      operationId: "createSchedule"
      summary: "UC-14.1 สร้างรอบ + auto-generate schedule_stop"
      description: |
        **Business Rule (F2)**
        1) สร้างตามเส้นทางที่กำหนด — เส้นทางต้องมีจุดจอดครบและ `route.total_minutes` ถูกต้อง
        2) **BR-02** `schedule_stop.arrive_at` = `depart_at + NUMTODSINTERVAL(SUM(travel_minutes),'MINUTE')`
           จุดแรกใช้เวลาเดียวกับ `depart_at` ถ้า `travel_minutes = 0`
        3) เส้นทางมีจำนวนรอบเท่าหรือต่างกันได้ — ตัวอย่างในเอกสาร: 09:30 / 11:00 / 13:00 / 15:00
        4) `(route_id, depart_at)` ห้ามซ้ำ (uq_route_depart) → ตอบ 409
        5) ปรับเปลี่ยนจัดการได้ใหม่ตลอดเวลา

        **Transaction (P-04 ข้อ 4)** - INSERT `schedule` แล้ว INSERT `schedule_stop`
        1 แถวต่อจุดจอดของเส้นทาง ใน Transaction เดียว
        ถ้าจุดจอดของเส้นทางยังไม่ครบจะ ROLLBACK ไม่ให้เหลือรอบที่ไม่มีตารางเวลา
      x-use-case: "UC-14"
      x-business-rules: ["BR-02"]
      x-transaction: "INSERT schedule + INSERT schedule_stop (ทุกจุดจอดของเส้นทาง)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
            example:
              route_id: 2
              service_date: "2026-10-02"
              depart_at: "2026-10-02T09:30:00.000Z"
              is_active: 1
      responses:
        "201":
          description: "สร้างรอบสำเร็จ พร้อมตารางเวลาที่ถึงทุกจุดจอด"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    example: "สร้างรอบสำเร็จ"
                  data:
                    $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "409 Conflict - เส้นทางนี้มีรอบเวลานี้อยู่แล้ว (uq_route_depart)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "DUPLICATED"
                  message: "เส้นทางนี้มีรอบเวลา 09:30 ของวันที่นี้อยู่แล้ว"
        "422":
          description: "422 - เส้นทางยังไม่มีจุดจอดครบ หรือ `total_minutes` ไม่ถูกต้อง"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: "ROUTE_STOPS_INCOMPLETE"
                  message: "กรุณาเรียงจุดจอดของเส้นทางให้ครบก่อนสร้างรอบเวลา"
        "500":
          $ref: "#/components/responses/InternalError"

