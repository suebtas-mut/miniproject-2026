<html lang="th">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#eef1f6; --card:#fff; --ink:#12203a; --muted:#6b7a99;
  --line:#dfe5ef; --brand:#1f5fa8; --brand2:#2f7ad4; --ok:#1c8a5a;
  --warn:#b26a00; --err:#c0392b; --chip:#f2f6fc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;font-size:14px}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 20px}
header h1{margin:0;font-size:18px}
header p{margin:4px 0 0;opacity:.9;font-size:12px}
.roles{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.roles button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px}
.roles button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.stage{padding:20px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.frame{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(20,40,80,.06);overflow:hidden}
.frame > figcaption{font-size:12px;padding:8px 12px;background:#f7f9fc;border-bottom:1px solid var(--line);color:var(--muted)}
.phone{width:360px}
.phone .screen{width:360px;height:700px;display:flex;flex-direction:column;background:#f6f8fc;overflow:hidden}
.tablet{width:760px}
.tablet .screen{width:760px;height:520px;display:flex;flex-direction:column;background:#f6f8fc;overflow:hidden}
.appbar{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.appbar h3{margin:0;font-size:15px;font-weight:600}
.appbar .sp{flex:1}
.appbar a{color:#fff;font-size:13px;text-decoration:none;opacity:.9}
.body{flex:1;overflow:auto;padding:14px}
.navbar{display:flex;border-top:1px solid var(--line);background:#fff;flex:0 0 auto}
.navbar div{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--muted)}
.navbar div.on{color:var(--brand);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h4{margin:0 0 8px;font-size:14px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;width:100%}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.ok{background:var(--ok)}
.btn:disabled{background:#b9c4d6;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:var(--chip);color:var(--muted);font-weight:600}
.scroll{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:11px;margin:2px 3px 2px 0}
.chip.g{background:#e7f6ef;border-color:#bfe6d3;color:var(--ok)}
.chip.a{background:#fdf3e2;border-color:#f0dcb4;color:var(--warn)}
.chip.r{background:#fdecea;border-color:#f5c9c4;color:var(--err)}
.alert{border-radius:8px;padding:9px 11px;font-size:12px;margin-bottom:10px}
.alert.i{background:#e8f1fb;border:1px solid #c6dcf5;color:#1a4d8a}
.alert.w{background:#fdf3e2;border:1px solid #f0dcb4;color:#8a5200}
.alert.e{background:#fdecea;border:1px solid #f5c9c4;color:#96271b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;color:var(--brand)}
.kpi span{font-size:11px;color:var(--muted)}
.qr{width:190px;height:190px;margin:10px auto;background:
  repeating-conic-gradient(#12203a 0% 25%,#fff 0% 50%) 0 0/16px 16px;border:6px solid #fff;box-shadow:0 0 0 1px var(--line)}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps div{flex:1;text-align:center;font-size:11px;padding:5px 0;border-radius:6px;background:#e6ebf4;color:var(--muted)}
.steps div.on{background:var(--brand);color:#fff;font-weight:600}
.timeline{border-left:2px solid var(--brand);margin:8px 0 8px 8px;padding-left:14px}
.timeline div{margin-bottom:10px;font-size:12px;position:relative}
.timeline div:before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
.tabbar2{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow:auto}
.tabbar2 div{padding:10px 14px;font-size:12px;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent}
.tabbar2 div.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.hide{display:none!important}
</style>
</head>

const GROUPS={
 'ลูกค้า':['login','cust-home','cust-book','cust-qr','cust-list','report-pick','report-r1'],
 'คนขับ':['login','driver-day','driver-manifest','driver-scan','driver-close','report-pick'],
 'พนักงาน':['login','staff-route','staff-sched','admin-emp','report-pick','report-r1'],
 'ผู้ดูแล':['login','admin-emp','admin-perm','staff-route','staff-sched','report-pick','report-r1'],
};
const map=Object.fromEntries(SCREENS.map(s=>[s.id,s]));

function render(role){
  document.getElementById('stage').innerHTML =
    GROUPS[role].map(id=>{const s=map[id];
      return `<figure class="frame" style="margin:0"><figcaption><b>${s.t}</b><br>${s.uc} · ${s.br}</figcaption>${s.html}</figure>`;
    }).join('');
}
document.getElementById('roles').innerHTML =
  Object.keys(GROUPS).map((r,i)=>`<button class="${i===0?'on':''}" data-r="${r}">${r}</button>`).join('');
document.getElementById('roles').onclick=e=>{
  if(e.target.dataset.r){document.querySelectorAll('#roles button').forEach(b=>b.classList.remove('on'));
    e.target.classList.add('on');render(e.target.dataset.r);}
};
render('ลูกค้า');
</script>
